name: CI

# Checks pull requests from contributors, who build the standalone flavour.
#
# The full pipeline (images, deploys) runs on GitLab, and GitLab always has the private
# package feed credential, so it only ever compiles the external sign-on build. This workflow covers the
# other one: the build every outside contributor gets from a plain clone, with
# the private authentication package left out (-p:InnovayseSso=false, see backend/Directory.Build.props).
# It needs no secrets, which is also what makes it safe to run on pull requests from forks.
#
# The plugin SDK (backend/src/Innovayse.SDK) is a git submodule from its own public repository, so
# every checkout below fetches submodules; without them the backend has no SDK project to build.
#
# Third-party actions are pinned to a commit SHA with the version in a comment; Dependabot
# (github-actions ecosystem) keeps both up to date.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Toolchain versions, named once for every job below.
env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "22"
  PHP_VERSION: "8.3"

# A newer push to a pull request supersedes the older run, so only that one is cancelled.
# Pushes to develop/main are never cancelled: a cancelled run there shows as a red check on
# the commit it was meant to verify.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (standalone build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Innovayse.Hostpanel.sln -p:InnovayseSso=false
      - name: Build
        run: dotnet build Innovayse.Hostpanel.sln -c Release --no-restore -p:InnovayseSso=false
      # The suites must be green with no plugin loaded: prove their outputs hold none before they run.
      - name: No plugin in the test outputs
        run: >-
          sh ../scripts/check-empty-plugins.sh
          tests/Innovayse.Hostpanel.Domain.Tests tests/Innovayse.Hostpanel.Architecture.Tests
          tests/Innovayse.CWP.Tests tests/Innovayse.Inecobank.Tests
      - name: Unit tests
        run: |
          for suite in Hostpanel.Domain Hostpanel.Architecture CWP Inecobank; do
            dotnet test "tests/Innovayse.$suite.Tests" -c Release --no-build
          done

  # Fails when a top-level folder of the Integration test project is in no shard below (its tests
  # would run nowhere), is in two, or when a shard names a folder that is gone. The same script
  # checks the GitLab pipeline, so the two lists cannot drift apart.
  integration-shards:
    name: Backend integration (shard coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Check every test folder is in exactly one shard
        run: sh scripts/check-integration-shards.sh .github/workflows/ci.yml .gitlab-ci.yml

  # The Integration suite starts a full API host for every test class (about 690 of them), each on
  # a database of its own on one shared PostgreSQL container. The test project's
  # integration.runsettings (picked up by dotnet test) bounds its native memory, and the suite is
  # split by top-level test folder into five shards that run in parallel, mirroring
  # backend:test:integration:a-e in .gitlab-ci.yml (which runs them one at a time). Billing alone
  # took a hosted runner to its limit, so it is split by the first letter of the test class name
  # (a filter per letter, Billing.Currencies falls under C):
  # A to K in shard 2, L to Z in shard 3. Every other folder belongs to exactly one shard; a new
  # folder must be added to one of them or its tests run nowhere, and the Billing letters must cover
  # A to Z exactly once, which integration-shards above enforces. (Fixtures/ holds fakes only, no tests.)
  integration:
    name: Backend integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1 of 5
            filter: >-
              FullyQualifiedName~Integration.Tests.Adapters.|FullyQualifiedName~Integration.Tests.Admin.|FullyQualifiedName~Integration.Tests.Audit.|FullyQualifiedName~Integration.Tests.Common.|FullyQualifiedName~Integration.Tests.Health.|FullyQualifiedName~Integration.Tests.Identity.|FullyQualifiedName~Integration.Tests.Security.|FullyQualifiedName~Integration.Tests.Shared.
          - shard: 2 of 5
            filter: >-
              FullyQualifiedName~Integration.Tests.Auth.|FullyQualifiedName~Integration.Tests.Clients.|FullyQualifiedName~Integration.Tests.Demo.|FullyQualifiedName~Integration.Tests.Scheduling.|FullyQualifiedName~Integration.Tests.Time.|FullyQualifiedName~Integration.Tests.Billing.A|FullyQualifiedName~Integration.Tests.Billing.B|FullyQualifiedName~Integration.Tests.Billing.C|FullyQualifiedName~Integration.Tests.Billing.D|FullyQualifiedName~Integration.Tests.Billing.E|FullyQualifiedName~Integration.Tests.Billing.F|FullyQualifiedName~Integration.Tests.Billing.G|FullyQualifiedName~Integration.Tests.Billing.H|FullyQualifiedName~Integration.Tests.Billing.I|FullyQualifiedName~Integration.Tests.Billing.J|FullyQualifiedName~Integration.Tests.Billing.K
          - shard: 3 of 5
            filter: >-
              FullyQualifiedName~Integration.Tests.Billing.L|FullyQualifiedName~Integration.Tests.Billing.M|FullyQualifiedName~Integration.Tests.Billing.N|FullyQualifiedName~Integration.Tests.Billing.O|FullyQualifiedName~Integration.Tests.Billing.P|FullyQualifiedName~Integration.Tests.Billing.Q|FullyQualifiedName~Integration.Tests.Billing.R|FullyQualifiedName~Integration.Tests.Billing.S|FullyQualifiedName~Integration.Tests.Billing.T|FullyQualifiedName~Integration.Tests.Billing.U|FullyQualifiedName~Integration.Tests.Billing.V|FullyQualifiedName~Integration.Tests.Billing.W|FullyQualifiedName~Integration.Tests.Billing.X|FullyQualifiedName~Integration.Tests.Billing.Y|FullyQualifiedName~Integration.Tests.Billing.Z|FullyQualifiedName~Integration.Tests.Reports.|FullyQualifiedName~Integration.Tests.Slides.|FullyQualifiedName~Integration.Tests.Faqs.|FullyQualifiedName~Integration.Tests.Partners.|FullyQualifiedName~Integration.Tests.Locations.|FullyQualifiedName~Integration.Tests.Projects.|FullyQualifiedName~Integration.Tests.Testimonials.
          - shard: 4 of 5
            filter: >-
              FullyQualifiedName~Integration.Tests.Domains.|FullyQualifiedName~Integration.Tests.Support.
          - shard: 5 of 5
            filter: >-
              FullyQualifiedName~Integration.Tests.Migration.|FullyQualifiedName~Integration.Tests.Notifications.|FullyQualifiedName~Integration.Tests.Orders.|FullyQualifiedName~Integration.Tests.Persistence.|FullyQualifiedName~Integration.Tests.Products.|FullyQualifiedName~Integration.Tests.Provisioning.|FullyQualifiedName~Integration.Tests.Services.
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # Ryuk stays on in CI so a killed shard cannot leave PostgreSQL containers behind.
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/Innovayse.Hostpanel.Integration.Tests -p:InnovayseSso=false
      - name: Build
        run: dotnet build tests/Innovayse.Hostpanel.Integration.Tests -c Release --no-restore -p:InnovayseSso=false
      # Every shard starts its hosts with no plugin present (see scripts/check-empty-plugins.sh).
      - name: No plugin in the test output
        run: sh ../scripts/check-empty-plugins.sh tests/Innovayse.Hostpanel.Integration.Tests
      - name: Integration tests (Testcontainers, shard ${{ matrix.shard }})
        run: dotnet test tests/Innovayse.Hostpanel.Integration.Tests -c Release --no-build --blame-crash --filter "${{ matrix.filter }}"

  # Unit tests of the migration source addon (PHP). They run the exporters against an in-memory
  # SQLite database, so the PHP setup must carry pdo_sqlite. Mirrors backend:test:migration-addon
  # in .gitlab-ci.yml.
  migration-addon:
    name: Migration addon (PHP unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/plugins/innovayse_migration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  client:
    name: Client portal (lint + typecheck + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn lint:i18n
      - run: yarn typecheck
      - run: yarn test

  admin:
    name: Admin panel (lint + unit tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run lint:i18n
      # `build` runs the type-check and the production build together.
      - run: npm run build
      - run: npm test -- --maxWorkers=2

  # Playwright flows against `vite preview`; the API is stubbed with page.route, so no backend
  # runs. Mirrors admin:e2e in .gitlab-ci.yml. The image tag must match the @playwright/test
  # version pinned in admin/package.json (and PLAYWRIGHT_ADMIN_IMAGE in .gitlab-ci.yml): the
  # image carries the browsers that exact version expects.
  admin-e2e:
    name: Admin panel (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: admin
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - run: npm ci
      - run: npm run e2e
