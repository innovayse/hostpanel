name: Publish to Docker Hub

# Primary publisher of the public hostpanel images: one repo, innovayse/hostpanel, with the component
# in the tag: api-<version>, client-<version>, admin-<version> and the moving api-latest, client-latest,
# admin-latest. Multi-arch (linux/amd64, linux/arm64); the version has no leading v.
#
# Each platform is built on a native runner (QEMU emulation hung the client's arm64
# `yarn build`): every component x platform job pushes by digest, then a merge job per component
# stitches the digests into the <component>-<version> and <component>-latest manifests.
#
# Images are public, so they are built with AUTH_MODE=local: the authentication package of the
# private flavour lives in a private feed and no credential is passed. Both frontends take every
# deployment value from the environment at start, so only the API image has a build arg.
#
# This workflow is the only publisher of these images; the GitLab pipeline does not publish.
#
# Gates: the tagged commit (or the commit a manual run is started on) must be an ancestor of main
# and must have a successful CI workflow run, otherwise nothing is built. Every image carries
# SLSA provenance (mode=max) and an SBOM attestation. Third-party actions are pinned to a commit
# SHA with the version in a comment; Dependabot keeps them up to date.
#
# Every checkout fetches submodules: the API image builds the plugin SDK from backend/src/Innovayse.SDK,
# a git submodule from its own public repository.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN. Variable: DOCKERHUB_NAMESPACE.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (for example 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the commit is on main and passed CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT" FETCH_HEAD; then
            echo "Commit $COMMIT is not an ancestor of main, refusing to publish."; exit 1
          fi
          passed=$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "The CI workflow has no successful run for commit $COMMIT, refusing to publish."; exit 1
          fi
          echo "Commit $COMMIT is on main and passed CI."

  prepare:
    name: Resolve the version and licence
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta_in.outputs.version }}
      licenses: ${{ steps.meta_in.outputs.licenses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Resolve the version and licence
        id: meta_in
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "$NAMESPACE" ]; then
            echo "DOCKERHUB_NAMESPACE must be set"; exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$version' is not MAJOR.MINOR.PATCH"; exit 1
          fi
          # The licence label is read from LICENSE, not typed in here, so it cannot drift from it.
          if ! grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE; then
            echo "LICENSE is not the AGPL text, set the SPDX id for it"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "licenses=AGPL-3.0-or-later" >> "$GITHUB_OUTPUT"

  build:
    name: Build hostpanel-${{ matrix.name }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: [api, client, admin]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - name: api
            dockerfile: backend/Dockerfile
            context: backend
            target: prod
            build_args: AUTH_MODE=local
          - name: client
            dockerfile: client/Dockerfile
            context: client
            target: prod
            # The chat server address is baked into the build (the /brand-assets/** proxy); an unset repository variable is empty.
            build_args: NUXT_PUBLIC_PORTAL_CHAT_BASE_URL=${{ vars.NUXT_PUBLIC_PORTAL_CHAT_BASE_URL }}
          - name: admin
            dockerfile: admin/Dockerfile
            # The Dockerfile copies admin/ and docker/nginx/admin.conf, so it builds from the repo root.
            context: .
            target: prod
            build_args: ""
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.NAMESPACE }}/hostpanel
          labels: |
            org.opencontainers.image.title=hostpanel-${{ matrix.name }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=${{ needs.prepare.outputs.licenses }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.NAMESPACE }}/hostpanel,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }},mode=max

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish hostpanel-${{ matrix.name }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        name: [api, client, admin]
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Download the digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.NAMESPACE }}/hostpanel
          tags: |
            type=raw,value=${{ matrix.name }}-${{ needs.prepare.outputs.version }}
            type=raw,value=${{ matrix.name }}-latest

      - name: Create the multi-platform manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${NAMESPACE}/hostpanel@sha256:%s " *)

      - name: Inspect the result
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "${NAMESPACE}/hostpanel:${{ matrix.name }}-${VERSION}"

      - name: Sync the Docker Hub README
        if: matrix.name == 'api'
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.NAMESPACE }}/hostpanel
          readme-filepath: ./docker/DOCKERHUB.md
