workflow:
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"      # → production (ProdServer, manual)
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "develop"   # → staging (LocalServer)
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"   # throwaway verification branch

stages: [test, build, deploy]

# ── Reusable templates (inlined — this project runs on a GitLab pull-mirror
#    of the GitHub repo and has no access to the workspace's shared
#    ci/templates.yml, so the relevant hidden jobs are copied here) ───────────

.test-dotnet:
  stage: test
  tags: [builder]
  image: mcr.microsoft.com/dotnet/sdk:9.0
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    # The credential for Innovayse.Auth, which lives in innovayse-workspace's package
    # registry. backend/nuget.config deliberately carries no credentials and expects
    # them from the environment, but nothing here ever supplied them: every restore
    # reached the feed anonymously and came back 401, so `dotnet test` failed before
    # running a single test and the build jobs behind it were skipped.
    #
    # This exact spelling is the one NuGet reads. The NUGET_PACKAGE_SOURCE_CREDENTIALS_
    # form named in nuget.config's comment is read by nothing — the same mistake the
    # workspace's compose files already had and fixed.
    #
    # It is the job's own token, valid only while the job runs. For it to be accepted
    # the workspace project must list this project in its CI_JOB_TOKEN allowlist,
    # since a job token is scoped to its own project by default.
    NuGetPackageSourceCredentials_innovayse: "Username=gitlab-ci-token;Password=${CI_JOB_TOKEN}"
  script:
    - cd "$SERVICE"
    - dotnet test --nologo

.test-node-yarn:
  stage: test
  tags: [builder]
  image: node:22
  script:
    - cd "$SERVICE"
    - corepack enable && corepack prepare yarn@1.22.22 --activate
    - yarn install --frozen-lockfile
    - yarn build

.test-node-npm:
  stage: test
  tags: [builder]
  image: node:22
  script:
    - cd "$SERVICE"
    - npm ci
    - npm run build-only

.build-image:
  stage: build
  tags: [builder]
  image: docker:27
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # The API image restores Innovayse.Auth during its build, so the credential has to
    # arrive as a build arg — see the note on .test-dotnet. Harmless for the client and
    # admin images, whose Dockerfiles never declare the ARG.
    - docker build --build-arg "NuGetPackageSourceCredentials_innovayse=Username=gitlab-ci-token;Password=$CI_JOB_TOKEN" --target "$IMAGE_TARGET" -f "$DOCKERFILE" -t "$IMAGE:$TAG" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$BUILD_CONTEXT"
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"

.deploy-staging:
  stage: deploy
  tags: [staging]
  variables:
    GIT_STRATEGY: none
    # The build below restores Innovayse.Auth from the package registry, so the
    # credential has to reach it here the same way it does on production.
    NUGET_INNOVAYSE_CREDENTIALS: "Username=gitlab-ci-token;Password=${CI_JOB_TOKEN}"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - cd "$DEPLOY_DIR"
    # GIT_STRATEGY is none, so the runner never touches this checkout — but the
    # deploy builds the api, client and admin images from it (neither compose file
    # gives those services an `image:`, so there is nothing to pull). Left alone it
    # deploys whatever was last checked out by hand; this host sat 33 commits back
    # that way. Sync it to the branch that triggered the pipeline so the tier
    # really is the branch.
    - git fetch --prune origin
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    # docker-compose.platform.yml joins the shared innovayse_network — without it
    # the containers are unreachable by name from the reverse proxy.
    - docker compose -f docker-compose.prod.yml -f docker-compose.platform.yml pull
    # Build them. The note above says this job builds these three images, and it did
    # not: the script pulled and brought them up, and since neither compose file gives
    # them an `image:`, `up -d` reused whatever was already on the host. Staging ran a
    # three-day-old API off an image nobody had replaced, through deploys that all
    # reported success — the same failure the checkout sync above was written to stop,
    # one step further along.
    - docker compose -f docker-compose.prod.yml -f docker-compose.platform.yml build hostpanel-api hostpanel-client admin
    # Services named one by one to leave nginx out. It publishes 80 and 443, which
    # on this host belong to the shared Nginx Proxy Manager that fronts every
    # Innovayse product — so it can never bind, and `up -d` fails the whole deploy
    # on it. Inside the workspace this product is reached through that proxy; its
    # own nginx is for a standalone deployment.
    - docker compose -f docker-compose.prod.yml -f docker-compose.platform.yml up -d hostpanel-db hostpanel-api hostpanel-client admin
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "develop"

# ── backend (Innovayse.API, .NET) ──────────────────────────────────────────────

backend:test:
  extends: .test-dotnet
  variables: { SERVICE: backend }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [backend/**/*]

backend:build:api:prod:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: docker/api.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [backend/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [backend/**/*]

backend:build:api:dev:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: docker/api.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [docker/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [docker/**/*]

# ── client (Nuxt frontend, yarn) ────────────────────────────────────────────────

client:test:
  extends: .test-node-yarn
  variables: { SERVICE: client }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [client/**/*]

client:build:prod:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: docker/client.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [client/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [client/**/*]

client:build:dev:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: docker/client.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [docker/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [docker/**/*]

# ── admin (Vue/Vite, npm) ────────────────────────────────────────────────────

admin:test:
  extends: .test-node-npm
  variables: { SERVICE: admin }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [admin/**/*]

admin:build:prod:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: docker/admin.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [admin/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [admin/**/*]

admin:build:dev:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: docker/admin.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [docker/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [docker/**/*]

# ── deploy ───────────────────────────────────────────────────────────────────

deploy:staging:
  extends: .deploy-staging
  variables:
    DEPLOY_DIR: /home/innovayse/www/innovayse-workspace/hostpanel
    # Which tier the API believes it is running on. docker-compose.yml passes
    # ${ASPNETCORE_ENVIRONMENT:-Development} through to it — the default is right for
    # a laptop, and it was what a deployed host inherited too unless someone had
    # remembered to write the variable into that host's .env by hand. An API left on
    # Development serves developer exception pages, and it is also what makes an
    # absent EncryptionKey allowed rather than fatal, so server credentials and
    # client-service passwords go to the database in plain text. Setting it per tier
    # here is what makes it true of the deployment rather than of one file on one
    # machine.
    ASPNETCORE_ENVIRONMENT: Staging
  environment: { name: staging/hostpanel }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "develop"
  needs:
    - job: backend:build:api:prod
      optional: true
    - job: client:build:prod
      optional: true
    - job: admin:build:prod
      optional: true

# ── production ───────────────────────────────────────────────────────────────
# ProdServer (10.0.0.4) serves host.innovayse.com. Unlike staging it does not
# consume registry images at all: inspecting the api container reports a bare
# `hostpanel-api` image, because this host builds its own from the checkout. So
# this job needs nothing from the build stage and declares `needs: []` — the
# build jobs require a `builder` runner, which this project does not have, and
# waiting on them would leave the deploy permanently pending.
#
# The three -f files are the exact set the running containers were created with.
# Composing with fewer would silently redefine the project. To read either fact
# off a running host, find the container by its Compose labels rather than by
# name — the name carries the project, which is just the deploy directory:
#
#   docker inspect $(docker ps -q #     -f label=com.docker.compose.project=hostpanel #     -f label=com.docker.compose.service=api) #     --format '{{.Config.Image}} {{index .Config.Labels "com.docker.compose.project.config_files"}}'
deploy:prod:
  stage: deploy
  tags: [prod]
  variables:
    GIT_STRATEGY: none
    DEPLOY_DIR: /home/innovayse-server/www/innovayse-workspace/hostpanel
    COMPOSE_FILES: -f docker-compose.prod.yml -f docker-compose.prodserver.yml -f docker-compose.platform.yml
    # See the note on deploy:staging above.
    ASPNETCORE_ENVIRONMENT: Production
    # This job builds the API image on the production host, so the Innovayse.Auth
    # credential has to reach the restore here too — docker-compose.prod.yml passes it
    # through as a build arg under this name. ProdServer's .env does not carry it, and
    # without it the restore goes to the feed anonymously and the build fails 401.
    NUGET_INNOVAYSE_CREDENTIALS: "Username=gitlab-ci-token;Password=${CI_JOB_TOKEN}"
  script:
    - git -C "$DEPLOY_DIR" fetch "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA"
    - git -C "$DEPLOY_DIR" checkout -f "$CI_COMMIT_SHA"
    - cd "$DEPLOY_DIR"
    # Dump the database before anything is rebuilt. The API applies pending EF
    # migrations on startup, so `up -d` is the moment the schema and sometimes the
    # data change — and until now the only copy of what they looked like beforehand
    # was whatever the host happened to have. The database is around 11 MB; the dump
    # costs a second and a few megabytes, and the last ten are kept.
    #
    # Failing the deploy when the dump fails is the point. A deploy that cannot be
    # undone should not start.
    - mkdir -p "$DEPLOY_DIR/backups"
    - >
      docker exec hostpanel-db sh -lc
      'pg_dump -U "$POSTGRES_USER" -d "${POSTGRES_DB:-hostpanel}" -Fc'
      > "$DEPLOY_DIR/backups/hostpanel-$(date -u +%Y%m%dT%H%M%SZ)-${CI_COMMIT_SHORT_SHA}.dump"
    - ls -1t "$DEPLOY_DIR"/backups/hostpanel-*.dump | tail -n +11 | xargs -r rm --
    - ls -lh "$DEPLOY_DIR"/backups/ | tail -3
    # The service keys, not the old ones. They were renamed to carry the product
    # prefix when container_name was introduced — `api` and `client` no longer exist
    # in any compose file here, so this job could only fail with "no such service".
    #
    # admin is included now as well. It was left out, so ProdServer kept serving the
    # admin panel from whatever image was built the last time someone ran compose by
    # hand, and a deploy could not replace that container at all.
    - docker compose $COMPOSE_FILES build hostpanel-api hostpanel-client admin
    - docker compose $COMPOSE_FILES up -d hostpanel-api hostpanel-client admin
  environment: { name: production/hostpanel, url: "https://host.innovayse.com", deployment_tier: production }
  # Manual on purpose — merging should not by itself change what customers see.
  when: manual
  allow_failure: false
  needs: []
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
