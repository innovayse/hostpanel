# Which pushes get a pipeline at all. Every branch-gated rule below hangs off this:
# a job's own `if:` is never evaluated unless a pipeline was created here first.
#
# Docker Hub images are not published from here: the GitHub workflow
# .github/workflows/publish-dockerhub.yml is the only publisher, so a version tag gets no pipeline.
workflow:
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"      # → production (manual)
    # A push to develop no longer builds anything. Staging is out of use, so the images
    # this produced and the staging deploy behind them were work nobody collected, and
    # the commits in it were already tested on the merge request that gated them. The
    # line is commented rather than deleted and every develop-gated job is left defined
    # and dormant, so bringing staging back is this one line.
    # - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "develop" # → staging
    # ci-test stays. It is not a branch anything is developed on, it exists to try a
    # change to this file on a real pipeline, which is the only way to verify one, and
    # it only builds when somebody deliberately pushes that name.
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"   # throwaway verification branch

stages: [test, build, deploy]

# Values several jobs share, written once. A project or environment-scoped CI/CD variable of the same
# name overrides the value here. Values that differ per environment are deliberately not defined here
# but are CI/CD variables scoped to the environment, and the deploy jobs refuse to run without them:
#   DEPLOY_DIR   each deploy job's checkout on its host (scoped to staging, production and demo)
#   HEALTH_URL   the health endpoint the staging and demo deploys wait for (production derives it
#                from PROD_PUBLIC_URL)
variables:
  # The only GitLab host that runs these pipelines (the pull-mirror of the GitHub repository).
  PIPELINE_SERVER_HOST: gitlab.com
  DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:9.0
  NODE_IMAGE: node:22
  DOCKER_IMAGE: docker:27
  # Each Playwright image tag equals the exact @playwright/test pinned in that app's package.json.
  PLAYWRIGHT_CLIENT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble
  PLAYWRIGHT_ADMIN_IMAGE: mcr.microsoft.com/playwright:v1.56.0-noble
  YARN_VERSION: "1.22.22"
  # PHP for the migration addon tests, pinned by digest. The official image ships pdo_sqlite.
  PHP_IMAGE: php:8.3.36-cli@sha256:d07db734bd519927010bbc66fa42c0d6f0207a4ee8419998df40931b884a5919
  # Composer is fetched as a single file and checked against its published SHA-256.
  COMPOSER_VERSION: "2.10.3"
  COMPOSER_SHA256: 7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
  # The compose chain every deployed tier runs; the demo adds its overlay. Colon-separated, the format
  # of Compose's own COMPOSE_FILE variable, which each deploy job sets: one value, nothing to word-split.
  COMPOSE_FILES_DEPLOYED: docker/docker-compose.shared.yml:docker/docker-compose.prod.yml:docker/docker-compose.platform.yml
  # How long a deploy waits for the health endpoint to answer before the job fails.
  HEALTH_TIMEOUT_SECONDS: "180"
  # The plugin SDK (backend/src/Hostpanel.Sdk) is a git submodule from its own public repository,
  # so every job the runner checks out fetches it too. The deploy jobs run with GIT_STRATEGY: none
  # and sync their own checkout, so they run `git submodule update` themselves after each checkout.
  GIT_SUBMODULE_STRATEGY: recursive

# ── Reusable templates (inlined, this project runs on a GitLab pull-mirror
#    of the GitHub repo, so the shared job definitions are copied here) ───────────

# The private package feed credential (see the note on .test-dotnet), composed here and nowhere else.
# Extended only by the jobs that restore NuGet (.test-dotnet, .build-image, .deploy-staging and
# deploy:prod), so no other job sees the token as a variable.
#
# One secret under one name: the CI/CD variable PRIVATE_FEED_TOKEN (masked, protected) holds only the
# password of the feed's deploy token, and PRIVATE_FEED_USER (protected) its user name. A pipeline on a
# protected ref gets both from the project. Any other ref (a merge request, a feature branch) is not given
# protected variables, so the defaults below apply: the job's own token, valid only while the job runs.
# That is why the two defaults are defined here under the same names; a project variable wins over them.
#
# The result is the exact spelling NuGet reads (the source name is part of the variable name). The jobs
# that build the API image hand it to docker as the BuildKit secret "nuget_credentials", and the deploy
# jobs pass it on to docker compose as NUGET_INNOVAYSE_CREDENTIALS.
.nuget-credentials:
  variables:
    PRIVATE_FEED_USER: "gitlab-ci-token"
    PRIVATE_FEED_TOKEN: $CI_JOB_TOKEN
    NuGetPackageSourceCredentials_innovayse: "Username=${PRIVATE_FEED_USER};Password=${PRIVATE_FEED_TOKEN}"

# Every test job a deploy waits for. A job's rules may leave a test out of a
# pipeline (the `changes:` filters), so each is optional: a test that did not run does not block, a test
# that failed does.
.deploy-needs-tests:
  needs:
    - { job: "backend:test", optional: true }
    - { job: "backend:test:shards", optional: true }
    - { job: "backend:test:integration:a", optional: true }
    - { job: "backend:test:integration:b", optional: true }
    - { job: "backend:test:integration:c", optional: true }
    - { job: "backend:test:integration:d", optional: true }
    - { job: "backend:test:integration:e", optional: true }
    - { job: "backend:test:migration-addon", optional: true }
    - { job: "client:test", optional: true }
    - { job: "client:e2e", optional: true }
    - { job: "admin:test", optional: true }
    - { job: "admin:e2e", optional: true }

.test-dotnet:
  extends: .nuget-credentials
  stage: test
  tags: [builder]
  image: $DOTNET_SDK_IMAGE
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    # The credential for the private authentication package, which lives in a private package
    # registry, comes from .nuget-credentials (NuGetPackageSourceCredentials_innovayse).
    # backend/nuget.config deliberately carries no credentials and expects them from the environment.
    #
    # The NUGET_PACKAGE_SOURCE_CREDENTIALS_ form is read by nothing.
    #
    # On an unprotected ref it is the job's own token, valid only while the job runs. For it to be
    # accepted the registry's project must list this project in its CI_JOB_TOKEN allowlist, since a
    # job token is scoped to its own project by default.
    # Testcontainers starts Ryuk, its reaper container, before the first real container and
    # then dials it on a mapped port. On the builder runner that connection is never made:
    # it waits its full minute, throws "ResourceReaperException: Initialization has been
    # cancelled", and every integration case fails in IntegrationTestFactory.InitializeAsync
    # before a Postgres container is even requested.
    #
    # Ryuk only removes containers a crashed run leaves behind. SharedPostgresServer disposes the
    # one Postgres of the run when the test process exits, so without Ryuk a leak needs a killed job, and
    # what it leaves is one Postgres container on the builder host to remove by hand.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - cd "$SERVICE"
    # -m:1 keeps MSBuild to a single node, so the solution's test projects build and run one
    # after another instead of all at once. The default fans them out, and each `dotnet test`
    # host holds its own copy of the EF model, roughly a gigabyte for the Infrastructure
    # suite alone. The runner host has limited memory and also runs other concurrent CI jobs,
    # so the parallel default exhausted it: the runner was killed mid-run and GitLab reported
    # `no_updates_running` and `runner_system_failure`, never a failing assertion, and never
    # a line of test output explaining it.
    #
    # It costs wall-clock and buys the job the ability to finish. Revisit if the host grows.
    #
    # --blame-crash because this job has failed with every assertion green: all suites report
    # "Passed! Failed: 0", then the run aborts with "Test host process crashed" during teardown,
    # where Testcontainers stops its Postgres, and the job exits 1 with no other output.
    # The flag makes the host write a sequence file naming the test in flight when it died,
    # and a dump beside it. Costs nothing on a passing run.
    #
    # The solution is no longer tested in one `dotnet test`: the Integration suite is split
    # into five jobs by test namespace (see backend:test:integration:a-e below), because one
    # host running the whole suite held the EF model plus a Postgres container for every
    # test and exhausted the runner's memory. Each job names its projects in TEST_PROJECTS
    # (folders under tests/) and, optionally, a --filter in TEST_FILTER.
    #
    # Each project is built first and scripts/check-empty-plugins.sh then proves its output holds no
    # plugin (plugins/ and plugins-installed/ beside the test binaries are what the host scans), so
    # every backend suite is shown green with an empty plugins directory in the same jobs rather than in
    # a duplicate set of them. The `dotnet test` after it finds the build up to date; do not turn that
    # into --no-build, which on the integration suite exits 0 with no output (see rules/project.md).
    - |
      for project in $TEST_PROJECTS; do
        dotnet build "tests/$project" --nologo -m:1 || exit 1
        sh ../scripts/check-empty-plugins.sh "tests/$project" || exit 1
        if [ -n "$TEST_FILTER" ]; then
          dotnet test "tests/$project" --nologo -m:1 --blame-crash --filter "$TEST_FILTER" || exit 1
        else
          dotnet test "tests/$project" --nologo -m:1 --blame-crash || exit 1
        fi
      done

.test-node-yarn:
  stage: test
  tags: [builder]
  image: $NODE_IMAGE
  script:
    - cd "$SERVICE"
    - corepack enable && corepack prepare yarn@${YARN_VERSION} --activate
    - yarn install --frozen-lockfile
    - yarn lint
    # Blocking: locale parity, unused keys and undefined literal keys fail the pipeline.
    - yarn lint:i18n
    # Blocking: every conformance metric (raw tags, jsdoc, braces, placeholders, test ids and so on) is zero.
    - yarn audit:conformance --strict
    - yarn typecheck
    - yarn test --maxWorkers=2
    - yarn build
  # The production build is what the e2e job serves (`node .output/server/index.mjs`).
  artifacts:
    expire_in: 1 day
    paths: [client/.output/]

.build-image:
  extends: .nuget-credentials
  stage: build
  tags: [builder]
  image: $DOCKER_IMAGE
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE
    DOCKER_BUILDKIT: "1"
    # The version comes from the newest release tag, so the clone needs its whole history and its tags.
    GIT_DEPTH: "0"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    # The one place the image version is derived (scripts/image-version.sh). Only the API image has a VERSION
    # build argument (the client and admin Dockerfiles would ignore it with a warning), so only its job derives
    # it. The script fails the job when no release tag is reachable, so an image never ships with the Dockerfile
    # placeholder 0.0.0-dev.
    - |
      if [ "$SERVICE" = "api" ]; then
        HOST_VERSION="$(sh scripts/image-version.sh)"
        set -- --build-arg "VERSION=$HOST_VERSION"
      else
        set --
      fi
    # The API image restores the private authentication package during its build. The credential
    # reaches it as the BuildKit secret "nuget_credentials" (read from the job environment, never a
    # build arg), so it is not stored in the image layers or its history. The client and admin
    # Dockerfiles never mount the secret. NUXT_PUBLIC_PORTAL_CHAT_BASE_URL is the client's build-time
    # proxy target; an unset CI/CD variable expands to empty (no proxy).
    - docker build "$@" --secret id=nuget_credentials,env=NuGetPackageSourceCredentials_innovayse --build-arg AUTH_MODE=sso --build-arg "NUXT_PUBLIC_PORTAL_CHAT_BASE_URL=$NUXT_PUBLIC_PORTAL_CHAT_BASE_URL" --target "$IMAGE_TARGET" -f "$DOCKERFILE" -t "$IMAGE:$TAG" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$BUILD_CONTEXT"
    # Both tags come from the one build above. A push that stalls would hold the job until the job
    # timeout, so each push has its own limit and is retried a bounded number of times; layers
    # already uploaded are skipped on a retry, but a layer cut off half way starts again from zero.
    # The limit is 900 s because the builder's upload can drop below 1 MB/s: on 2026-11-13 the API's
    # largest layer did not fit in 240 s and all three attempts were cut off ("context canceled").
    # The second tag only re-links layers that are already there. Worst case (two attempts of
    # 900 s plus a 10 s grace and the pause) is about 31 minutes on top of the build, inside the
    # 60 minute job limit. Any failed push is retried, an authentication failure included.
    - |
      for tag in "$TAG" "$CI_COMMIT_SHORT_SHA"; do
        attempt=1
        until timeout -k 10 900 docker push "$IMAGE:$tag"; do
          if [ "$attempt" -ge 2 ]; then
            echo "Pushing $IMAGE:$tag failed after $attempt attempts" >&2
            exit 1
          fi
          attempt=$((attempt + 1))
          echo "Push failed, attempt $attempt of 2 in 10 seconds"
          sleep 10
        done
      done
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"

# Fetches only the commit being deployed into $DEPLOY_DIR, with no history, so the transfer stays small.
# A long transfer can break on a flaky link, so the fetch is retried a bounded number of times.
.fetch-target-commit:
  script:
    - |
      attempt=1
      until git -C "$DEPLOY_DIR" fetch --depth 1 "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA"; do
        if [ "$attempt" -ge 4 ]; then
          echo "Fetching $CI_COMMIT_SHA failed after $attempt attempts" >&2
          exit 1
        fi
        attempt=$((attempt + 1))
        echo "Fetch failed, attempt $attempt of 4 in 10 seconds"
        sleep 10
      done

.deploy-staging:
  extends: .nuget-credentials
  stage: deploy
  tags: [staging]
  variables:
    GIT_STRATEGY: none
    # The build below restores the private authentication package from the package registry, so the
    # credential has to reach it here the same way it does on production.
    NUGET_INNOVAYSE_CREDENTIALS: $NuGetPackageSourceCredentials_innovayse
    COMPOSE_FILE: $COMPOSE_FILES_DEPLOYED
    # The local image names docker/docker-compose.prod.yml builds and runs: the project's own registry path.
    IMAGE_REGISTRY: $CI_REGISTRY_IMAGE
    # Which tier the API believes it is running on. docker/docker-compose.dev.yml passes
    # ${ASPNETCORE_ENVIRONMENT} through to it, the laptop .env sets Development, and
    # a deployed host inherited that too unless someone had remembered to write the
    # variable into that host's .env by hand. An API left on Development serves developer
    # exception pages. Setting it per tier here is what makes it true of the deployment rather
    # than of one file on one machine. Every deployed tier (staging, prod, demo) is Production.
    ASPNETCORE_ENVIRONMENT: Production
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR must be set as a CI/CD variable scoped to this environment" >&2; exit 1; }
    - test -n "$HEALTH_URL" || { echo "HEALTH_URL must be set as a CI/CD variable scoped to this environment" >&2; exit 1; }
    - cd "$DEPLOY_DIR"
    # GIT_STRATEGY is none, so the runner never touches this checkout, but the
    # deploy builds the api, client and admin images from it (neither compose file
    # gives those services an `image:`, so there is nothing to pull). Left alone it
    # deploys whatever was last checked out by hand. Sync it to the branch that
    # triggered the pipeline so the tier really is the branch.
    - git fetch --prune origin
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    # The plugin SDK is a submodule: point it at the URL and commit this checkout records.
    - git submodule sync --recursive
    - sh scripts/clear-stale-submodule-dirs.sh .
    - git submodule update --init --recursive --force
    # docker-compose.platform.yml joins the platform network, without it the containers are
    # unreachable by name from the reverse proxy. The chain (COMPOSE_FILE) is shared + prod + platform,
    # the same set every deployed tier runs. Compose reads docker/.env (the host's values) because
    # the files sit in docker/.
    #
    # Staging has no CI-built image for the develop branch, so the three application
    # images are built here from the synced checkout and tagged hostpanel/<svc>:stage
    # (prod.yml carries both `image:` and `build:`); only the infrastructure images are pulled.
    - export IMAGE_TAG=stage
    - docker compose pull --ignore-buildable
    - docker compose build hostpanel-api hostpanel-client hostpanel-admin
    # Services named one by one to leave nginx out. It publishes 80 and 443, which
    # on this host belong to the shared reverse proxy, so it can never bind. The platform overlay parks it too.
    - docker compose up -d hostpanel-db hostpanel-api hostpanel-client hostpanel-admin
    # The job is green only when the stack answers, not merely when its containers started.
    - sh scripts/wait-for-health.sh "$HEALTH_URL" "$HEALTH_TIMEOUT_SECONDS"
  # This job has no `image:`, so it is the shell executor: the login above writes
  # the runner user's real ~/.docker/config.json on the host, and nothing
  # took it away again. CI_JOB_TOKEN dies with the job, but the entry stayed, and
  # Docker sends it on every later pull from the registry, including
  # public ones. That is how main-branch test jobs failed to pull the runner helper
  # image with "HTTP Basic: Access denied" before running a single
  # test. after_script runs even when the deploy fails, which is exactly when the
  # stale entry would otherwise be left behind.
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    # Off with the job that extends this. A rule here is overridden by any job that
    # declares its own, so this is not what stops deploy:staging, it is what stops a
    # job added later that forgets to.
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "develop" && $DEPLOY_STAGING == "true"

# ── backend (Innovayse.Hostpanel.API, .NET) ──────────────────────────────────────────────

backend:test:
  extends: .test-dotnet
  variables:
    SERVICE: backend
    TEST_PROJECTS: >-
      Innovayse.Hostpanel.Domain.Tests
      Innovayse.Hostpanel.Architecture.Tests
      Innovayse.CWP.Tests
  rules:
    # main is reached only through a GitHub PR whose CI ran these same suites before the
    # merge; running them again here only delayed the deploy by ~20 minutes. Set
    # RUN_MAIN_TESTS=true on a pipeline to run them anyway.
    - if: $CI_COMMIT_BRANCH == "main" && $RUN_MAIN_TESTS != "true"
      when: never
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes: [backend/**/*]

# Fails when the client portal's Content-Security-Policy differs between the Caddy and nginx edges.
edge:test:csp:
  stage: test
  tags: [builder]
  image: $DOTNET_SDK_IMAGE
  script:
    - sh scripts/check-edge-csp.sh
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes:
        - docker/caddy/Caddyfile
        - docker/nginx/templates/default.conf.template
        - scripts/check-edge-csp.sh

# Runs the shipped Caddy and nginx edges and the admin image's nginx in front of a stub upstream and fails when
# the Content-Security-Policy headers a browser would receive differ from what the edges promise. The script
# copies files into its containers instead of mounting them, so it works against the runner's shared Docker socket.
edge:test:headers:
  stage: test
  tags: [builder]
  image: $DOCKER_IMAGE
  script:
    - sh scripts/check-edge-headers.sh
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes:
        - docker/caddy/Caddyfile
        - docker/nginx/**/*
        - scripts/check-edge-headers.sh
        - scripts/edge-headers-assert.sh

# Runs scripts/image-version.sh in throwaway repositories: the version an image is built with.
image-version:test:
  stage: test
  tags: [builder]
  image: $DOTNET_SDK_IMAGE
  script:
    - sh scripts/test-image-version.sh
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes:
        - scripts/image-version.sh
        - scripts/test-image-version.sh

# Runs install.sh against a fake docker: the upgrade backup, its retention and --rollback.
installer:test:backup:
  stage: test
  tags: [builder]
  image: $DOTNET_SDK_IMAGE
  script:
    - bash scripts/test-install-backup.sh
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes:
        - install.sh
        - scripts/test-install-backup.sh

# Fails when a top-level folder of the Integration test project is in no shard below (its tests would
# run nowhere), is in two, or when a shard names a folder that is gone. The same script checks the
# GitHub workflow, so the shard lists of the two pipelines cannot drift apart.
backend:test:shards:
  stage: test
  tags: [builder]
  image: $DOTNET_SDK_IMAGE
  script:
    - sh scripts/check-integration-shards.sh .gitlab-ci.yml .github/workflows/ci.yml
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes:
        - backend/tests/**/*
        - scripts/check-integration-shards.sh
        - .gitlab-ci.yml
        - .github/workflows/ci.yml

# The Integration suite, in five shards that run ONE AT A TIME. Every top-level folder of the
# test project belongs to exactly one shard, except Billing, which is split by the first letter of
# the test class name (A to K in b, L to Z in c); a new folder
# must be added to one of them or its tests run nowhere, and the Billing letters must cover A to Z
# exactly once, which backend:test:shards enforces. (Fixtures/ holds fakes only, no tests.)
# The split is the same as the five shards of .github/workflows/ci.yml, where they run in
# parallel on hosted runners that the whole of Billing in one shard took to their limit.
#
# Each test class starts a full API host on a database of its own on one shared Postgres
# container, and the test project's integration.runsettings (picked up by dotnet test) sets the
# glibc arena limit and runs two classes at a time, so one testhost stays under 4 GB for the
# whole suite. The builder host's memory is shared with other pipelines, so the
# shards still run one at a time (resource_group); the split keeps each job short.
.test-integration:
  extends: .test-dotnet
  resource_group: hostpanel-integration
  variables:
    SERVICE: backend
    TEST_PROJECTS: Innovayse.Hostpanel.Integration.Tests
  rules:
    # main is reached only through a GitHub PR whose CI ran these same suites before the
    # merge; running them again here only delayed the deploy by ~20 minutes. Set
    # RUN_MAIN_TESTS=true on a pipeline to run them anyway.
    - if: $CI_COMMIT_BRANCH == "main" && $RUN_MAIN_TESTS != "true"
      when: never
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes: [backend/**/*]

backend:test:integration:a:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Adapters.|FullyQualifiedName~Integration.Tests.Admin.|FullyQualifiedName~Integration.Tests.Audit.|FullyQualifiedName~Integration.Tests.Common.|FullyQualifiedName~Integration.Tests.Health.|FullyQualifiedName~Integration.Tests.Identity.|FullyQualifiedName~Integration.Tests.Security.|FullyQualifiedName~Integration.Tests.Shared.

backend:test:integration:b:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Auth.|FullyQualifiedName~Integration.Tests.Clients.|FullyQualifiedName~Integration.Tests.Demo.|FullyQualifiedName~Integration.Tests.Scheduling.|FullyQualifiedName~Integration.Tests.Time.|FullyQualifiedName~Integration.Tests.Billing.A|FullyQualifiedName~Integration.Tests.Billing.B|FullyQualifiedName~Integration.Tests.Billing.C|FullyQualifiedName~Integration.Tests.Billing.D|FullyQualifiedName~Integration.Tests.Billing.E|FullyQualifiedName~Integration.Tests.Billing.F|FullyQualifiedName~Integration.Tests.Billing.G|FullyQualifiedName~Integration.Tests.Billing.H|FullyQualifiedName~Integration.Tests.Billing.I|FullyQualifiedName~Integration.Tests.Billing.J|FullyQualifiedName~Integration.Tests.Billing.K

backend:test:integration:c:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Billing.L|FullyQualifiedName~Integration.Tests.Billing.M|FullyQualifiedName~Integration.Tests.Billing.N|FullyQualifiedName~Integration.Tests.Billing.O|FullyQualifiedName~Integration.Tests.Billing.P|FullyQualifiedName~Integration.Tests.Billing.Q|FullyQualifiedName~Integration.Tests.Billing.R|FullyQualifiedName~Integration.Tests.Billing.S|FullyQualifiedName~Integration.Tests.Billing.T|FullyQualifiedName~Integration.Tests.Billing.U|FullyQualifiedName~Integration.Tests.Billing.V|FullyQualifiedName~Integration.Tests.Billing.W|FullyQualifiedName~Integration.Tests.Billing.X|FullyQualifiedName~Integration.Tests.Billing.Y|FullyQualifiedName~Integration.Tests.Billing.Z|FullyQualifiedName~Integration.Tests.Reports.|FullyQualifiedName~Integration.Tests.Slides.|FullyQualifiedName~Integration.Tests.Faqs.|FullyQualifiedName~Integration.Tests.Partners.|FullyQualifiedName~Integration.Tests.Locations.|FullyQualifiedName~Integration.Tests.Projects.|FullyQualifiedName~Integration.Tests.Testimonials.

backend:test:integration:d:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Domains.|FullyQualifiedName~Integration.Tests.Plugins.|FullyQualifiedName~Integration.Tests.StatusPage.|FullyQualifiedName~Integration.Tests.Support.|FullyQualifiedName~Integration.Tests.Campaigns.

backend:test:integration:e:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Fraud.|FullyQualifiedName~Integration.Tests.Migration.|FullyQualifiedName~Integration.Tests.Notifications.|FullyQualifiedName~Integration.Tests.Orders.|FullyQualifiedName~Integration.Tests.Persistence.|FullyQualifiedName~Integration.Tests.Products.|FullyQualifiedName~Integration.Tests.Provisioning.|FullyQualifiedName~Integration.Tests.Services.

# Unit tests of the migration source addon (PHP). They run the exporters against an in-memory
# SQLite database through pdo_sqlite, which the official PHP image carries. Composer needs unzip
# to unpack the packages it downloads. The cache key is this job's own, so no other job reads it.
# Mirrors the migration-addon job of .github/workflows/ci.yml.
backend:test:migration-addon:
  stage: test
  tags: [builder]
  image: $PHP_IMAGE
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    key: "$CI_JOB_NAME_SLUG"
    paths: [.composer-cache/]
  script:
    - apt-get update && apt-get install -y --no-install-recommends unzip
    - curl -fsSL -o /usr/local/bin/composer "https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar"
    - echo "${COMPOSER_SHA256}  /usr/local/bin/composer" | sha256sum -c -
    - chmod +x /usr/local/bin/composer
    - cd backend/plugins/innovayse_migration
    - composer install --no-interaction --no-progress
    - composer test
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes: [backend/plugins/**/*]

# The three prod build jobs have no `changes:` filter on purpose: deploy:prod pulls all three images by
# the pipeline's own tag ($CI_COMMIT_SHORT_SHA), so every pipeline on main has to push every one of them.
backend:build:api:prod:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: backend/Dockerfile, BUILD_CONTEXT: backend, IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"

backend:build:api:dev:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: backend/Dockerfile, BUILD_CONTEXT: backend, IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
      changes: [backend/Dockerfile]
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"
      changes: [backend/Dockerfile]

# ── client (Nuxt frontend, yarn) ────────────────────────────────────────────────

client:test:
  extends: .test-node-yarn
  variables: { SERVICE: client }
  rules:
    # main is reached only through a GitHub PR whose CI ran these same suites before the
    # merge; running them again here only delayed the deploy by ~20 minutes. Set
    # RUN_MAIN_TESTS=true on a pipeline to run them anyway.
    - if: $CI_COMMIT_BRANCH == "main" && $RUN_MAIN_TESTS != "true"
      when: never
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes: [client/**/*]

# Playwright against the production build of client:test, with the stub backend
# (client/e2e/support/stub-backend.mjs) standing in for the API. The image tag equals
# the exact @playwright/test pinned in client/package.json (PLAYWRIGHT_CLIENT_IMAGE); a caret
# range let the lockfile drift past the image and every browser launch failed.
client:e2e:
  stage: test
  tags: [builder]
  image: $PLAYWRIGHT_CLIENT_IMAGE
  needs: [client:test]
  script:
    - cd client
    - corepack enable && corepack prepare yarn@${YARN_VERSION} --activate
    - yarn install --frozen-lockfile
    - yarn e2e
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths: [client/test-results/, client/e2e-results.xml]
  rules:
    # main is reached only through a GitHub PR whose CI ran these same suites before the
    # merge; running them again here only delayed the deploy by ~20 minutes. Set
    # RUN_MAIN_TESTS=true on a pipeline to run them anyway.
    - if: $CI_COMMIT_BRANCH == "main" && $RUN_MAIN_TESTS != "true"
      when: never
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes: [client/**/*]

client:build:prod:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: client/Dockerfile, BUILD_CONTEXT: client, IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"

client:build:dev:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: client/Dockerfile, BUILD_CONTEXT: client, IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
      changes: [client/Dockerfile]
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"
      changes: [client/Dockerfile]

# ── admin (Vue/Vite, npm) ────────────────────────────────────────────────────

# Every gate the admin has, in the order a failure is cheapest to read: lint (non-fixing),
# i18n catalogues, the real typecheck (-b --force), unit tests, then the production build.
admin:test:
  stage: test
  tags: [builder]
  image: $NODE_IMAGE
  script:
    - cd admin
    - npm ci
    - npm run lint:ci
    - npm run lint:i18n
    - npm run typecheck
    - npm test -- --maxWorkers=2
    - npm run build-only
  rules:
    # main is reached only through a GitHub PR whose CI ran these same suites before the
    # merge; running them again here only delayed the deploy by ~20 minutes. Set
    # RUN_MAIN_TESTS=true on a pipeline to run them anyway.
    - if: $CI_COMMIT_BRANCH == "main" && $RUN_MAIN_TESTS != "true"
      when: never
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes: [admin/**/*]

# Playwright flows against `vite preview`; the API is stubbed with page.route, so no backend runs.
# The image tag (PLAYWRIGHT_ADMIN_IMAGE) must match the @playwright/test version pinned in admin/package.json.
admin:e2e:
  stage: test
  tags: [builder]
  image: $PLAYWRIGHT_ADMIN_IMAGE
  needs: [admin:test]
  script:
    - cd admin
    - npm ci
    - npm run e2e
  rules:
    # main is reached only through a GitHub PR whose CI ran these same suites before the
    # merge; running them again here only delayed the deploy by ~20 minutes. Set
    # RUN_MAIN_TESTS=true on a pipeline to run them anyway.
    - if: $CI_COMMIT_BRANCH == "main" && $RUN_MAIN_TESTS != "true"
      when: never
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST
      changes: [admin/**/*]

admin:build:prod:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: admin/Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"

admin:build:dev:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: admin/Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
      changes: [admin/Dockerfile, docker/nginx/admin.conf]
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"
      changes: [admin/Dockerfile, docker/nginx/admin.conf]

# ── deploy ───────────────────────────────────────────────────────────────────
# Every deploy waits for the test jobs (.deploy-needs-tests) and, last, for the health endpoint.

deploy:staging:
  extends: .deploy-staging
  environment: { name: staging/hostpanel }
  rules:
    # Staging deploys are off: that host filled its disk and this job fails in get_sources,
    # before the deploy script runs at all. Production is unaffected, it deploys from main,
    # on another host, and is manual. Set DEPLOY_STAGING=true in CI/CD variables to turn it
    # back on; the condition below is the one this job had before, unchanged.
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "develop" && $DEPLOY_STAGING == "true"
  needs:
    - !reference [.deploy-needs-tests, needs]
    - job: backend:build:api:prod
      optional: true
    - job: client:build:prod
      optional: true
    - job: admin:build:prod
      optional: true

# ── demo ─────────────────────────────────────────────────────────────────────
# A second copy of the stack in demo mode (fake payment, registrar and provisioning adapters, mail to
# its own mailhog, periodic data reset) on the production host, beside production. The chain is
# shared + prod + platform + demo and the project is pinned to hostpanel-demo (-p), so containers,
# volumes, broker, redis and the database are the demo's own and prod data is never touched.
# Manual, like production. Images are built here from the checkout and tagged :demo, so prod's
# :latest is never overwritten.
#
# CI/CD variables (scope demo/hostpanel). The job's environment wins over docker/.env on the host,
# so the demo's own values never leak into, or from, production's .env:
#   DEMO_ENABLED, DEMO_RESET_INTERVAL_HOURS, DEMO_ADMIN_EMAIL, DEMO_ADMIN_PASSWORD (required),
#   DEMO_CLIENT_EMAIL, DEMO_CLIENT_PASSWORD (required), DEMO_SMTP_PORT, DEMO_REDIS_PORT,
#   DEMO_API_HOST_PORT, DEMO_CLIENT_HOST_PORT, DEMO_ADMIN_HOST_PORT, DEMO_MAILHOG_UI_HOST_PORT,
#   DEMO_ADMIN_BASE_URL and DEMO_CLIENT_BASE_URL (both required: the bases of the links the demo mail carries),
#   DEMO_PUBLISH_ADDRESS (required: the address the demo's published ports bind to) and DEMO_SMTP_ENCRYPTION,
#   optionally DEMO_CONTACT_EMAIL / DEMO_CONTACT_PHONE (the storefront contact; unset keeps the fictional pair),
#   DEMO_NETWORK_SUBNET and DEMO_EDGE_NETWORK_SUBNET (the subnets the demo API trusts forwarded addresses from;
#   the edge one is the subnet hostpanel_demo_edge is created with below),
#   HEALTH_URL (required: the demo's public health endpoint, waited for after the deploy),
# plus the demo's own DOMAIN, ADMIN_DOMAIN, ALLOWED_HOSTS and POSTGRES_DB, with AUTH_MODE=local, and
# DEPLOY_DIR: the demo's own checkout on the host, never production's.
deploy:demo:
  extends: .deploy-staging
  tags: [prod]
  variables:
    # The demo has a checkout of its own (DEPLOY_DIR, scoped to demo/hostpanel): this job runs
    # `git checkout -f`, which in production's directory would swap the files under the running
    # production stack. Demo behaviour comes from Demo__Enabled, not from the environment name.
    COMPOSE_FILE: $COMPOSE_FILES_DEPLOYED:docker/docker-compose.demo.yml
    IMAGE_TAG: demo
    # The compose project that keeps the demo's containers, volumes and network apart from production's.
    COMPOSE_PROJECT_NAME: hostpanel-demo
  script:
    - test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR must be set as a CI/CD variable scoped to this environment" >&2; exit 1; }
    - test -n "$HEALTH_URL" || { echo "HEALTH_URL must be set as a CI/CD variable scoped to this environment" >&2; exit 1; }
    - test -d "$DEPLOY_DIR/.git" || git init "$DEPLOY_DIR"
    - !reference [.fetch-target-commit, script]
    - git -C "$DEPLOY_DIR" checkout -f "$CI_COMMIT_SHA"
    - git -C "$DEPLOY_DIR" submodule sync --recursive
    - sh "$DEPLOY_DIR/scripts/clear-stale-submodule-dirs.sh" "$DEPLOY_DIR"
    - git -C "$DEPLOY_DIR" submodule update --init --recursive --force
    - cd "$DEPLOY_DIR"
    # The demo's edge network is external (docker-compose.demo.yml) and is not the platform network: create it
    # when missing. The operator's edge proxy must also be attached to it to route here.
    # The subnet is fixed (DEMO_EDGE_NETWORK_SUBNET): the operator's edge proxy must deny exactly this subnet on every host
    # except the demo ones, so a demo container cannot reach production through the proxy. If the subnet changes here,
    # change the `deny` rule of that edge proxy to the same value.
    - docker network inspect hostpanel_demo_edge >/dev/null 2>&1 || docker network create --subnet "$DEMO_EDGE_NETWORK_SUBNET" hostpanel_demo_edge
    - docker compose pull --ignore-buildable
    - docker compose build hostpanel-demo-api hostpanel-demo-client hostpanel-demo-admin
    # Services named one by one: nginx is parked, and the demo's broker, redis and mailhog come with the api.
    - docker compose up -d hostpanel-db hostpanel-demo-api hostpanel-demo-client hostpanel-demo-admin
    - sh scripts/wait-for-health.sh "$HEALTH_URL" "$HEALTH_TIMEOUT_SECONDS"
  environment: { name: demo/hostpanel }
  when: manual
  allow_failure: true
  needs:
    - !reference [.deploy-needs-tests, needs]
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "ci-test"

# ── production ───────────────────────────────────────────────────────────────
# The production host serves the public site. It never builds: backend:build:api:prod, client:build:prod
# and admin:build:prod build the three images in this pipeline and push them tagged $CI_COMMIT_SHORT_SHA,
# and the deploy pulls exactly those and recreates the containers. A build on the host would download every
# package again over that host's own network link, and a corrupted download fails the deploy.
#
# COMPOSE_FILE (docker/) is the exact set the running containers were created with.
# Composing with fewer would silently redefine the project. To read it off a running host, find the
# container by its Compose labels rather than by name, because the name carries the project, which is
# just the deploy directory:
#
#   docker inspect "$(docker ps -q -f label=com.docker.compose.project=hostpanel -f label=com.docker.compose.service=hostpanel-api)" --format '{{.Config.Image}} {{index .Config.Labels "com.docker.compose.project.config_files"}}'
# Frees disk on the production host: Docker's build cache and untagged images only. Running
# containers, volumes, the database and the hostpanel-rollback/*:previous images are kept. A full
# disk stopped the deploy of 2026-10-30 and its rollback alike.
maintenance:prod-free-disk:
  stage: deploy
  tags: [prod]
  variables:
    GIT_STRATEGY: none
  script:
    - df -h / /var/lib/docker 2>/dev/null || df -h /
    - docker builder prune -af
    - docker image prune -f
    - df -h / /var/lib/docker 2>/dev/null || df -h /
  when: manual
  allow_failure: true
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:prod:
  stage: deploy
  tags: [prod]
  variables:
    GIT_STRATEGY: none
    # DEPLOY_DIR is the CI/CD variable scoped to production/hostpanel.
    COMPOSE_FILE: $COMPOSE_FILES_DEPLOYED
    # The tag the prod build jobs of this same pipeline pushed, so the deploy runs the code that was tested.
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    # The local image names docker/docker-compose.prod.yml runs: the project's own registry path.
    IMAGE_REGISTRY: $CI_REGISTRY_IMAGE
    # See the note on .deploy-staging above.
    ASPNETCORE_ENVIRONMENT: Production
    # Where the pre-deploy database dumps go, and how many of the newest are kept.
    BACKUP_DIR: $DEPLOY_DIR/backups
    BACKUP_KEEP: "10"
    # The public health endpoint, waited for after the deploy.
    HEALTH_URL: $PROD_PUBLIC_URL/health
  # The images are pulled from the project's registry with the job's own token, which dies with the job.
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR must be set as a CI/CD variable scoped to this environment" >&2; exit 1; }
    - test -n "$PROD_PUBLIC_URL" || { echo "PROD_PUBLIC_URL must be set as a CI/CD variable scoped to this environment" >&2; exit 1; }
    # Checked before anything is touched: a non-numeric BACKUP_KEEP would otherwise break the
    # prune step only after the dump, with the deploy half done.
    - |
      case "$BACKUP_KEEP" in
        ''|*[!0-9]*) echo "BACKUP_KEEP must be a whole number, got '$BACKUP_KEEP'" >&2; exit 1 ;;
      esac
    # What is running now, recorded before anything changes, so that after_script can put it
    # back when this deploy fails: the commit the stack was started from and the image each
    # service's container was created from.
    - mkdir -p "$DEPLOY_DIR/.deploy"
    - git -C "$DEPLOY_DIR" rev-parse HEAD > "$DEPLOY_DIR/.deploy/previous-commit"
    - |
      : > "$DEPLOY_DIR/.deploy/previous-images"
      for svc in hostpanel-api hostpanel-client hostpanel-admin; do
        cid=$(docker ps -q --filter "label=com.docker.compose.service=$svc" | head -1)
        [ -n "$cid" ] || continue
        # Recreating the container on the new image can leave the old one untagged, and an untagged
        # image is gone by the time a rollback wants it. A tag of its own keeps it.
        docker tag "$(docker inspect "$cid" --format '{{.Image}}')" "hostpanel-rollback/$svc:previous"
        echo "$svc hostpanel-rollback/$svc:previous" >> "$DEPLOY_DIR/.deploy/previous-images"
      done
      cat "$DEPLOY_DIR/.deploy/previous-images"
    - !reference [.fetch-target-commit, script]
    - git -C "$DEPLOY_DIR" checkout -f "$CI_COMMIT_SHA"
    # The plugin SDK is a submodule: point it at the URL and commit this checkout records.
    - git -C "$DEPLOY_DIR" submodule sync --recursive
    - sh "$DEPLOY_DIR/scripts/clear-stale-submodule-dirs.sh" "$DEPLOY_DIR"
    - git -C "$DEPLOY_DIR" submodule update --init --recursive --force
    - cd "$DEPLOY_DIR"
    # Dump the database before anything is rebuilt. The API applies pending EF
    # migrations on startup, so `up -d` is the moment the schema and sometimes the
    # data change, and the dump is the only copy of what they looked like beforehand.
    # The last BACKUP_KEEP dumps are kept.
    #
    # Failing the deploy when the dump fails is the point. A deploy that cannot be
    # undone should not start.
    - mkdir -p "$BACKUP_DIR"
    - >
      docker exec hostpanel-db sh -lc
      'pg_dump -U "$POSTGRES_USER" -d "${POSTGRES_DB}" -Fc'
      > "$BACKUP_DIR/hostpanel-$(date -u +%Y%m%dT%H%M%SZ)-${CI_COMMIT_SHORT_SHA}.dump"
    - ls -1t "$BACKUP_DIR"/hostpanel-*.dump | tail -n +$((BACKUP_KEEP + 1)) | xargs -r rm --
    - ls -lh "$BACKUP_DIR"/ | tail -3
    # The service keys carry the product prefix (hostpanel-api, hostpanel-client, hostpanel-admin);
    # the admin is deployed with the others so that its container is replaced too.
    # The images are the ones this pipeline built, pulled by IMAGE_TAG. --no-build makes it impossible for
    # compose to fall back to building on this host when a pull has failed to leave an image behind.
    - docker compose pull hostpanel-api hostpanel-client hostpanel-admin
    - docker compose up -d --no-build hostpanel-api hostpanel-client hostpanel-admin
    # A deploy that reports success has not necessarily recreated a container. Compare the image
    # each container was created from against the one its tag points at now, and recreate only where
    # they differ, so a redeploy of the same commit does not restart containers that already run it.
    - |
      for svc in hostpanel-api hostpanel-client hostpanel-admin; do
        cid=$(docker compose ps -q "$svc")
        if [ -z "$cid" ]; then echo "ERROR: $svc is not running after up -d"; exit 1; fi
        tag=$(docker inspect "$cid" --format '{{.Config.Image}}')
        want=$(docker image inspect "$tag" --format '{{.Id}}')
        have=$(docker inspect "$cid" --format '{{.Image}}')
        if [ "$have" != "$want" ]; then
          echo "$svc runs ${have#sha256:} but its image is now ${want#sha256:} - recreating."
          docker compose up -d --force-recreate --no-build --no-deps "$svc"
          cid=$(docker compose ps -q "$svc")
          have=$(docker inspect "$cid" --format '{{.Image}}')
          if [ "$have" != "$want" ]; then
            echo "ERROR: $svc is still on ${have#sha256:} after --force-recreate"
            exit 1
          fi
        fi
        echo "$svc is on image ${have#sha256:}"
      done
    # The job is green only when the site answers, not merely when its containers started.
    - sh scripts/wait-for-health.sh "$HEALTH_URL" "$HEALTH_TIMEOUT_SECONDS"
  # A failed deploy left the site on whatever had half-started, and the reason was in the logs
  # of a container the next deploy replaced. On failure: print the new containers' logs first,
  # then put back the commit and images recorded above. Migrations the new API already applied
  # stay applied; the dump taken above is the way back from those.
  after_script:
    - |
      # The login in before_script wrote this runner user's real ~/.docker/config.json, see .deploy-staging.
      docker logout "$CI_REGISTRY" || true
      [ "$CI_JOB_STATUS" = "failed" ] || exit 0
      state="$DEPLOY_DIR/.deploy"
      [ -s "$state/previous-images" ] || { echo "Nothing recorded to roll back to."; exit 0; }
      cd "$DEPLOY_DIR"
      for svc in hostpanel-api hostpanel-client hostpanel-admin; do
        echo "──── last 80 log lines of $svc ────"
        docker logs --tail 80 "$svc" 2>&1 || true
      done
      echo "──── rolling back to $(cat "$state/previous-commit") ────"
      git checkout -f "$(cat "$state/previous-commit")"
      git submodule sync --recursive
      git submodule update --init --recursive --force
      # Compose runs each service on ${IMAGE_REGISTRY}/<name>:${IMAGE_TAG}, with <name> the service key without
      # its product prefix. Put the recorded image under that name, so the recreate below starts it.
      while read -r svc previous; do
        docker tag "$previous" "$IMAGE_REGISTRY/${svc#hostpanel-}:$IMAGE_TAG"
        docker compose up -d --no-deps --force-recreate --no-build "$svc"
      done < "$state/previous-images"
      sh scripts/wait-for-health.sh "$HEALTH_URL" "$HEALTH_TIMEOUT_SECONDS" && echo "Rolled back; the site answers."
  environment: { name: production/hostpanel, url: "$PROD_PUBLIC_URL", deployment_tier: production }
  # Manual on purpose: merging should not by itself change what customers see.
  when: manual
  allow_failure: false
  # The three image builds are required, not optional: the deploy pulls what they pushed.
  needs:
    - !reference [.deploy-needs-tests, needs]
    - backend:build:api:prod
    - client:build:prod
    - admin:build:prod
  rules:
    - if: $CI_SERVER_HOST == $PIPELINE_SERVER_HOST && $CI_COMMIT_BRANCH == "main"
