workflow:
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"   # throwaway verification branch

stages: [test, build, deploy]

# ── Reusable templates (inlined — this project runs on a GitLab pull-mirror
#    of the GitHub repo and has no access to the workspace's shared
#    ci/templates.yml, so the relevant hidden jobs are copied here) ───────────

.test-dotnet:
  stage: test
  tags: [builder]
  image: mcr.microsoft.com/dotnet/sdk:9.0
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  script:
    - cd "$SERVICE"
    - dotnet test --nologo

.test-node-yarn:
  stage: test
  tags: [builder]
  image: node:22
  script:
    - cd "$SERVICE"
    - corepack enable && corepack prepare yarn@1.22.22 --activate
    - yarn install --frozen-lockfile
    - yarn build

.test-node-npm:
  stage: test
  tags: [builder]
  image: node:22
  script:
    - cd "$SERVICE"
    - npm ci
    - npm run build-only

.build-image:
  stage: build
  tags: [builder]
  image: docker:27
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --target "$IMAGE_TARGET" -f "$DOCKERFILE" -t "$IMAGE:$TAG" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$BUILD_CONTEXT"
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"

.deploy-staging:
  stage: deploy
  tags: [staging]
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - cd "$DEPLOY_DIR"
    # docker-compose.platform.yml joins the shared innovayse_network — without it
    # the containers are unreachable by name from the reverse proxy.
    - docker compose -f docker-compose.prod.yml -f docker-compose.platform.yml pull
    - docker compose -f docker-compose.prod.yml -f docker-compose.platform.yml up -d
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"

# ── backend (Innovayse.API, .NET) ──────────────────────────────────────────────

backend:test:
  extends: .test-dotnet
  variables: { SERVICE: backend }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [backend/**/*]

backend:build:api:prod:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: docker/api.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [backend/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [backend/**/*]

backend:build:api:dev:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: docker/api.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [docker/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [docker/**/*]

# ── client (Nuxt frontend, yarn) ────────────────────────────────────────────────

client:test:
  extends: .test-node-yarn
  variables: { SERVICE: client }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [client/**/*]

client:build:prod:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: docker/client.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [client/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [client/**/*]

client:build:dev:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: docker/client.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [docker/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [docker/**/*]

# ── admin (Vue/Vite, npm) ────────────────────────────────────────────────────

admin:test:
  extends: .test-node-npm
  variables: { SERVICE: admin }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [admin/**/*]

admin:build:prod:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: docker/admin.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [admin/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [admin/**/*]

admin:build:dev:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: docker/admin.Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [docker/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [docker/**/*]

# ── deploy ───────────────────────────────────────────────────────────────────

deploy:staging:
  extends: .deploy-staging
  variables:
    DEPLOY_DIR: /home/innovayse/www/innovayse-workspace/hostpanel
    # Which tier the API believes it is running on. docker-compose.yml passes
    # ${ASPNETCORE_ENVIRONMENT:-Development} through to it — the default is right for
    # a laptop, and it was what a deployed host inherited too unless someone had
    # remembered to write the variable into that host's .env by hand. An API left on
    # Development serves developer exception pages, and it is also what makes an
    # absent EncryptionKey allowed rather than fatal, so server credentials and
    # client-service passwords go to the database in plain text. Setting it per tier
    # here is what makes it true of the deployment rather than of one file on one
    # machine.
    ASPNETCORE_ENVIRONMENT: Staging
  environment: { name: staging/hostpanel }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
  needs:
    - job: backend:build:api:prod
      optional: true
    - job: client:build:prod
      optional: true
    - job: admin:build:prod
      optional: true

# ── production ───────────────────────────────────────────────────────────────
# ProdServer (10.0.0.4) serves host.innovayse.com. Unlike staging it does not
# consume registry images at all: inspecting the api container reports a bare
# `hostpanel-api` image, because this host builds its own from the checkout. So
# this job needs nothing from the build stage and declares `needs: []` — the
# build jobs require a `builder` runner, which this project does not have, and
# waiting on them would leave the deploy permanently pending.
#
# The three -f files are the exact set the running containers were created with.
# Composing with fewer would silently redefine the project. To read either fact
# off a running host, find the container by its Compose labels rather than by
# name — the name carries the project, which is just the deploy directory:
#
#   docker inspect $(docker ps -q #     -f label=com.docker.compose.project=hostpanel #     -f label=com.docker.compose.service=api) #     --format '{{.Config.Image}} {{index .Config.Labels "com.docker.compose.project.config_files"}}'
deploy:prod:
  stage: deploy
  tags: [prod]
  variables:
    GIT_STRATEGY: none
    DEPLOY_DIR: /home/innovayse-server/www/innovayse-workspace/hostpanel
    COMPOSE_FILES: -f docker-compose.prod.yml -f docker-compose.prodserver.yml -f docker-compose.platform.yml
    # See the note on deploy:staging above.
    ASPNETCORE_ENVIRONMENT: Production
  script:
    - git -C "$DEPLOY_DIR" fetch "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA"
    - git -C "$DEPLOY_DIR" checkout -f "$CI_COMMIT_SHA"
    - cd "$DEPLOY_DIR"
    - docker compose $COMPOSE_FILES build api client
    - docker compose $COMPOSE_FILES up -d api client
  environment: { name: production/hostpanel, url: "https://host.innovayse.com", deployment_tier: production }
  # Manual on purpose — merging should not by itself change what customers see.
  when: manual
  allow_failure: false
  needs: []
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
