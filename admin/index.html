<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <!-- Rewritten at container start from ADMIN_BASE_URL_PATH; every relative URL resolves against it. -->
    <base href="/">
    <!-- A classic script on purpose: it is replaced at container start, so the bundler must leave it alone (vite-ignore). -->
    <script src="config.js" vite-ignore></script>
    <!--
      The built-in mark, shown until the branding settings load and useFavicon swaps these
      for the operator's own. A tab needs an icon before any JavaScript runs, so these stay
      even though a configured deployment replaces them a moment later.

      Same eight file names every product in the workspace ships; see brand/README.md.
      Rendered from the cube mark (favicon.svg) and the app tile -- never edit them by hand.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5E8EF3">
    <!-- Windows start-screen tile. Relative on purpose: Vite does not rewrite meta content, so these resolve against <base>. -->
    <meta name="msapplication-TileImage" content="mstile-150x150.png">
    <meta name="msapplication-TileColor" content="#0B0B14">
    <meta name="msapplication-config" content="browserconfig.xml">
    <!--
      The browser chrome colour: the panel's page background in each scheme (main.css).
      The theme pre-paint script (src/lib/themeBoot.ts) is added at the end of <head> as the
      same-origin file theme-boot.js by the admin-theme-boot plugin (src/lib/themeBootPlugin.ts): it applies the stored light/dark choice and
      rewrites these metas before the first paint, so the panel never flashes the wrong scheme.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fb">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0f">
    <!--
      Without the manifest Android ignores the 192/512 pair entirely, and the maskable
      variants have nothing to declare them.

      This href is absolute so Vite rewrites it to the deployment base. A relative one would
      resolve against whatever route the SPA was deep-linked to — fine at /admin/, a 404 at
      /admin/settings/system. The icon paths *inside* the manifest stay relative for the
      mirror-image reason: Vite does not rewrite a static JSON file, and they resolve against
      the manifest's own URL, which is already base-correct.
    -->
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!--
      An operator console, never a search result. The edge proxy sends the matching
      X-Robots-Tag header; this covers any deployment that serves the SPA without it.
    -->
    <meta name="robots" content="noindex, nofollow">
    <title>HostPanel Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
