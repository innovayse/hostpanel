# hostpanel-ssh-key-agent — CentOS Web Panel (CWP) profile.
# On top of the generic identity checks: the account must be a CWP account (root_cwp.user, via
# providers/cwp/account-check) and must not be suspended (CWP suspends with `usermod -L`).
#
# Servers that jail customer SSH (for example Jailkit with a second sshd restricted by AllowGroups)
# usually allow shell logins only to one group; set ssh_group to it so keys only go to accounts
# that can use them. A server that already keeps an SSH opt-in list can point eligible_list at it.
[agent]
provider = cwp
binding =
min_uid = 1000
home_root = /home
deny_accounts = root,admin,nobody,mysql,postfix,dovecot,named,apache,nginx,hpsshkeys
max_keys = 20
audit_log = /var/log/hostpanel-ssh-key-agent.log
lock_dir = /run/hostpanel-ssh-key-agent
ssh_group =
eligible_list =
account_check_command = /usr/local/libexec/hostpanel-ssh-key-agent/account-check
check_shadow_lock = true
# Jailed SSH enrolment (agent 1.2.0+). Off here; turn it on per server once its customer sshd chroots
# the jail_group (e.g. `Match Group sftp-ssh` + `ChrootDirectory /home/jail/%u`) and jailkit is
# installed. See README "Jailed SSH enrolment".
jail_enrol = false
# Innovayse Sites (agent 1.3.0+): prepares an AI Hosting account's domain for Laravel deploys on request
# (op prepare-site). Leave empty to refuse the op; the helper is installed with the cwp provider.
site_prepare_command =
jail_root = /home/jail
jail_group = sftp-ssh
jail_sections = basicshell,editors,extendedshell,netutils,terminfo
jail_shell = /bin/bash
jail_extras = /usr/bin/uname,/usr/bin/id,/usr/bin/hostname,/usr/bin/dircolors,/usr/bin/rsync,/usr/bin/tar,/usr/bin/gzip,/usr/bin/unzip,/etc/bashrc,/etc/profile.d/colorls.sh,/etc/DIR_COLORS
systemd_unit_dir = /etc/systemd/system
