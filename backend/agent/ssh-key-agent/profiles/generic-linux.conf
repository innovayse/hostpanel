# hostpanel-ssh-key-agent: generic Linux profile.
# Identity checks only: the account must exist in passwd, have uid >= min_uid, not be on the deny
# list, and have its home directly under home_root. Shell access is required to receive keys.
# Add an opt-in list or a panel account check below when the server has one.
[agent]
provider = generic-linux
binding =
min_uid = 1000
home_root = /home
deny_accounts = root,admin,nobody,mysql,postfix,dovecot,named,apache,nginx,hpsshkeys
max_keys = 20
audit_log = /var/log/hostpanel-ssh-key-agent.log
lock_dir = /run/hostpanel-ssh-key-agent
ssh_group =
eligible_list =
account_check_command =
check_shadow_lock = true
