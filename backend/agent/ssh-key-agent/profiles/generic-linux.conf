# hostpanel-ssh-key-agent: generic Linux profile.
# Identity checks: the account must exist in passwd, have uid >= min_uid, not be on the deny
# list, and have its home directly under home_root. Shell access is required to receive keys.
# Add an opt-in list or a panel account check below when the server has one.
#
# Websites (agent 1.6.0+): the helpers in providers/generic-linux serve a site of an account from Apache or nginx
# with php-fpm, on Debian and Ubuntu and on RHEL and AlmaLinux. The web server is the one that is running; when both
# or neither run, set web_server below. See README "Generic Linux websites".
[agent]
provider = generic-linux
binding =
min_uid = 1000
home_root = /home
deny_accounts = root,admin,nobody,mysql,postfix,dovecot,named,apache,nginx,hpsshkeys,www-data,ubuntu,debian,ec2-user,almalinux,rocky,nfsnobody
max_keys = 20
audit_log = /var/log/hostpanel-ssh-key-agent.log
lock_dir = /run/hostpanel-ssh-key-agent
ssh_group =
eligible_list =
account_check_command =
check_shadow_lock = true
# apache or nginx. Empty means "the one that is running"; a server with both or neither running refuses websites
# until this is set.
web_server =
