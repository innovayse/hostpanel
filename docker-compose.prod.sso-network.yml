# Optional overlay for prod deployments that share innovayse-cloud-local_innovayse_network
# with a real SSO deployment. Not part of docker-compose.prod.yml itself since
# that file must also work standalone on boxes without this network (it'd fail
# with "network declared as external, but could not be found" otherwise).
#
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.prod.sso-network.yml ...
networks:
  innovayse_network:
    external: true
    name: innovayse-cloud-local_innovayse_network

services:
  api:
    networks:
      - default
      - innovayse_network

  client:
    networks:
      - default
      - innovayse_network

  admin:
    networks:
      - default
      - innovayse_network
