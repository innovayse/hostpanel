services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Application ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Smtp__Host: ${SMTP_HOST}
      # No default. An unset key here means every server credential this product
      # stores goes to the database unencrypted, so the API refuses to start instead.
      EncryptionKey: ${ENCRYPTION_KEY:?required}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Cors__AllowedOrigins__0: https://${DOMAIN}
      Cors__AllowedOrigins__1: https://${ADMIN_DOMAIN}
      # SSO is optional — only meaningful where a real SSO deployment shares
      # innovayse_network with this stack (see the `networks:` block below).
      # Defaults to local (JWT) auth when unset, matching a standalone box.
      Auth__Mode: ${AUTH_MODE:-local}
      Sso__Authority: ${SSO_URL:-}
      Sso__ClientId: ${SSO_CLIENT_ID:-hostpanel}
      # The cookie session for the admin SPA, read only when AUTH_MODE=sso.
      # AddInnovayseAuth is skipped entirely under local — the default here, and
      # what a standalone box runs — so none of these have to be set there. Under
      # sso all of them are required: the API refuses to start naming the missing
      # one, rather than come up and hand every visitor an anonymous session.
      #
      # No :?required on the secret, unlike the other products: it would stop a
      # local-mode host from starting over a value it never reads.
      Auth__AppName: hostpanel
      Auth__Authority: ${SSO_URL:-}
      Auth__PublicAuthority: ${SSO_PUBLIC_URL:-}
      Auth__ClientId: ${SSO_CLIENT_ID:-hostpanel}
      Auth__ClientSecret: ${CLIENT_HOSTPANEL_SECRET:-}
      Auth__RedisConnection: ${REDIS_CONNECTION:-redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      target: prod
      args:
        # The app-launcher widget's <script> tag is baked in at build time
        # (see client.Dockerfile) — the runtime env var below only affects
        # useRuntimeConfig() reads, not that static tag, so it must be
        # repeated here as a build arg for the widget to actually appear.
        NUXT_PUBLIC_MAIN_URL: ${NUXT_PUBLIC_MAIN_URL:-}
    environment:
      # Nitro/Nuxt production builds freeze runtimeConfig defaults at build
      # time (nuxt.config.ts isn't re-evaluated at container start like it is
      # in dev mode). Nitro's own fix for this is reading NUXT_<KEY> /
      # NUXT_PUBLIC_<KEY> at runtime and overriding the frozen default — every
      # var below MUST use that exact prefix+casing to actually take effect;
      # plain names (matching the dev compose file) are silently ignored here.
      NUXT_API_URL: http://api:5148
      NUXT_PUBLIC_BASE_URL: https://${DOMAIN}
      # The app-launcher widget script is injected over whatever origin this
      # points at — must be HTTPS on an HTTPS deployment or browsers block it
      # as mixed content, which hangs the client dashboard's hydration.
      NUXT_PUBLIC_MAIN_URL: ${NUXT_PUBLIC_MAIN_URL:-}
      NUXT_SSO_URL: ${SSO_URL:-}
      NUXT_SSO_PUBLIC_URL: ${SSO_PUBLIC_URL:-}
      NUXT_PUBLIC_SSO_PUBLIC_URL: ${SSO_PUBLIC_URL:-}
      NUXT_SSO_CLIENT_ID: ${SSO_CLIENT_ID:-hostpanel}
      NUXT_SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      NUXT_SSO_CALLBACK_URL: https://${DOMAIN}/api/portal/auth/sso/callback
      NUXT_AUTH_MODE: ${AUTH_MODE:-local}
      NUXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-local}
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: prod
      args:
        VITE_BASE_URL: ${ADMIN_BASE_URL_PATH:-/}
        VITE_SSO_URL: ${SSO_PUBLIC_URL:-https://accounts.innovayse.com}
        VITE_SSO_CLIENT_ID: ${ADMIN_SSO_CLIENT_ID:-hostpanel-admin}
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    depends_on:
      - api
      - client
      - admin
    restart: unless-stopped

volumes:
  pgdata:
