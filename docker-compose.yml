services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hostpanel_dev}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1026:1025"
      - "8027:8025"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # Sessions and the data protection key ring for the admin SPA's cookie auth.
  # Unused under Auth__Mode=local, and cheap enough to leave running there rather
  # than hide behind a profile a standalone sso deployment would have to know to
  # activate. Inside the workspace the platform overlay parks it and the shared
  # instance answers to the same name, so no connection string changes.
  #
  # Persisted, not cache-only: the key ring lives here, and losing it invalidates
  # every session cookie in circulation — everyone signed out by a container
  # recreate, which is exactly what a deploy does.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Application ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    ports:
      - "5149:5148"
    volumes:
      - ./backend:/app
      - backend_bin:/app/src/Innovayse.API/bin
      - backend_obj:/app/src/Innovayse.API/obj
      - backend_packages:/root/.nuget/packages
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-hostpanel_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET:-change-this-to-a-32-char-min-secret-key-here}
      Jwt__Issuer: ${JWT_ISSUER:-innovayse-api}
      Jwt__Audience: ${JWT_AUDIENCE:-innovayse-clients}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:5174
      Cors__AllowedOrigins__2: http://panel.local
      Cors__AllowedOrigins__3: https://stage-panel.innovayse.com
      Smtp__Host: mailhog
      Smtp__Port: 1025
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__FromEmail: noreply@innovayse.com
      Smtp__FromName: Innovayse
      Smtp__UseSsl: "false"
      # Required outside Development: without it the EF configurations silently drop
      # their encrypted-column converters and server passwords, API tokens and access
      # hashes are written to the database in plain text. The dev default is a real
      # 32-byte key so a fresh clone exercises the same code path production does.
      EncryptionKey: ${ENCRYPTION_KEY:-ZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiE=}
      DOTNET_USE_POLLING_FILE_WATCHER: 1
      DOTNET_NUGET_SIGNATURE_VERIFICATION: "false"
      NUGET_AUDIT: "false"
      Sso__Authority: http://sso-api:8080
      Sso__ClientId: hostpanel
      # The cookie session for the admin SPA. Read only when the mode is sso —
      # AddInnovayseAuth is skipped entirely under local, which is what keeps this
      # product deployable on its own with no SSO anywhere. Under sso all of them
      # are required and the API refuses to start if one is missing, rather than
      # come up and hand every visitor an anonymous session.
      Auth__Mode: ${AUTH_MODE:-sso}
      Auth__AppName: hostpanel
      Auth__Authority: ${SSO_URL:-http://sso-api:8080}
      # Where the browser is sent to sign in, when that differs from the address
      # this container reaches the SSO on. Optional: unset, Authority is used for
      # both, which is right whenever the SSO is publicly addressable.
      Auth__PublicAuthority: ${SSO_PUBLIC_URL:-}
      Auth__ClientId: ${SSO_CLIENT_ID:-hostpanel}
      # No :?required, unlike the other products: local mode never reads it, and a
      # required variable here would stop a standalone box from starting at all.
      # Under sso an empty value fails at startup by name instead.
      Auth__ClientSecret: ${CLIENT_HOSTPANEL_SECRET:-}
      Auth__RedisConnection: ${REDIS_CONNECTION:-redis:6379}
      BackchannelLogout__Key: ${HOSTPANEL_BACKCHANNEL_LOGOUT_KEY:-dev-hostpanel-backchannel-key}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      target: dev
    ports:
      - "3001:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      # Container name, not the "api" network alias — that alias collides with innovayse-main's
      # own "api" service on the shared innovayse_network, and Docker's embedded DNS round-robins
      # between them, randomly routing requests to the wrong app's backend.
      API_URL: http://hostpanel-api-1:5148
      NUXT_PUBLIC_BASE_URL: ${NUXT_PUBLIC_BASE_URL:-http://panel.local}
      NUXT_PUBLIC_MAIN_URL: ${NUXT_PUBLIC_MAIN_URL:-http://app.local}
      SSO_URL: http://sso-api:8080
      SSO_PUBLIC_URL: ${SSO_PUBLIC_URL:-http://accounts.local}
      NUXT_PUBLIC_TASKS_URL: ${NUXT_PUBLIC_TASKS_URL:-http://tasks.local}
      NUXT_PUBLIC_ERP_URL: ${NUXT_PUBLIC_ERP_URL:-http://erp.local}
      NUXT_PUBLIC_SHEETS_URL: ${NUXT_PUBLIC_SHEETS_URL:-http://sheets.local}
      NUXT_PUBLIC_EMAIL_URL: ${NUXT_PUBLIC_EMAIL_URL:-http://email.local}
      NUXT_PUBLIC_NEXTCLOUD_URL: ${NUXT_PUBLIC_NEXTCLOUD_URL:-http://cloud.local}
      SSO_CLIENT_ID: hostpanel
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-changeme}
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-http://panel.local/api/portal/auth/sso/callback}
      STRIPE_PUBLISHABLE_KEY: pk_test_51Tc3tOEHRuUOoZmggqrvyuddpdtx6FtKaUSvqQXkwokJakOBFCLRDlX6troVkkjFw966agSmLKnu1NSlOAki6u9600PatIOktW
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      AUTH_MODE: ${AUTH_MODE:-sso}
      NUXT_MAIN_API_URL: http://main-client:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: dev
    ports:
      - "5174:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: /api
      API_PROXY_TARGET: http://api:5148
      VITE_SSO_URL: http://accounts.local
      VITE_SSO_CLIENT_ID: hostpanel-admin
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

volumes:
  pgdata:
  redisdata:
  client_node_modules:
  admin_node_modules:
  backend_bin:
  backend_obj:
  backend_packages:

