services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    # Named explicitly so `docker ps` shows this rather than Compose's
    # <project>-<service>-<index>. The product prefix is not decoration:
    # container names are global to the Docker daemon, so a bare `api` or
    # `redis` is refused as soon as another product's stack claims it.
    container_name: hostpanel-db
    image: postgres:17-alpine
    # Addressed by this name rather than by the service name, because "postgres" is
    # what several products call their database service and the shared network hands
    # that name out round-robin between all of them.
    networks:
      default:
        aliases: [hostpanel-db]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  rabbitmq:
    container_name: hostpanel-rabbitmq
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  mailhog:
    container_name: hostpanel-mailhog
    image: mailhog/mailhog
    ports:
      - "1026:1025"
      - "8027:8025"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # Sessions and the data protection key ring for the admin SPA's cookie auth.
  # Unused under Auth__Mode=local, and cheap enough to leave running there rather
  # than hide behind a profile a standalone sso deployment would have to know to
  # activate. Inside the workspace the platform overlay parks it and the shared
  # instance answers to the same name, so no connection string changes.
  #
  # Persisted, not cache-only: the key ring lives here, and losing it invalidates
  # every session cookie in circulation — everyone signed out by a container
  # recreate, which is exactly what a deploy does.
  redis:
    container_name: hostpanel-redis
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Application ─────────────────────────────────────────────────────────────
  api:
    container_name: hostpanel-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    # The name other products, the edge proxy and the dev proxy address this one
    # by. Declared here rather than in docker-compose.platform.yml so it resolves
    # in a standalone deployment too — the alternative was the container name,
    # Compose's <project>-<service>-<index>, which breaks on a directory rename, a
    # second replica, or the stack coming up under another project's name.
    networks:
      default:
        aliases: [hostpanel-api]
    ports:
      - "5149:5148"
    volumes:
      - ./backend:/app
      - backend_bin:/app/src/Innovayse.API/bin
      - backend_obj:/app/src/Innovayse.API/obj
      - backend_packages:/root/.nuget/packages
      # The integration suite is run from inside this container — `dotnet test` on the
      # host writes obj/ and bin/ into the bind mount above and kills the watcher this
      # container is running. Those tests use Testcontainers, which needs to talk to a
      # Docker daemon, so the host's socket is passed in: without it all 41 fail in
      # their fixture constructor with "Docker is either not running or misconfigured",
      # which reads like a broken test suite rather than a missing mount.
      #
      # Dev only. It is not in the prod target, and it should not be: a process that
      # can reach this socket can do anything the daemon can.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Testcontainers starts sibling containers on the host, not children of this one,
      # so the address it hands the test is a host port. "localhost" from in here is
      # this container; host.docker.internal is the machine the daemon runs on.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      # The alias, not the bare service name: on the shared platform network several
      # products' database services are all called "postgres", so the name resolved to
      # more than one address and connections landed in another product's database.
      ConnectionStrings__DefaultConnection: "Host=hostpanel-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Development on a laptop, Staging on the stage host, Production on the prod one.
      # It was pinned to Development here, which meant a deployed host served developer
      # exception pages and re-ran the test-data seeder on every restart.
      ASPNETCORE_ENVIRONMENT: ${HOSTPANEL_ASPNETCORE_ENVIRONMENT:-Development}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:5174
      Cors__AllowedOrigins__2: http://panel.local
      Cors__AllowedOrigins__3: https://stage-panel.innovayse.com
      Smtp__Host: mailhog
      Smtp__Port: 1025
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__FromEmail: noreply@innovayse.com
      Smtp__FromName: Innovayse
      Smtp__UseSsl: "false"
      # Required outside Development: without it the EF configurations silently drop
      # their encrypted-column converters and server passwords, API tokens and access
      # hashes are written to the database in plain text. .env.example carries a real
      # 32-byte key so a fresh clone exercises the same code path production does.
      EncryptionKey: ${ENCRYPTION_KEY}
      DOTNET_USE_POLLING_FILE_WATCHER: 1
      DOTNET_NUGET_SIGNATURE_VERIFICATION: "false"
      NUGET_AUDIT: "false"
      # Restoring Innovayse.Auth needs a credential for the private registry, and
      # this API restores at container start rather than at image build — it runs
      # `dotnet watch`. CI passes the same value as a build-arg for the products
      # whose images are built in the pipeline; this is the equivalent for a host
      # that builds in place. A deploy token scoped to read_package_registry, never
      # a personal one: it can read packages and do nothing else.
      NuGetPackageSourceCredentials_innovayse: ${NUGET_INNOVAYSE_CREDENTIALS}
      Sso__Authority: http://sso-api:8080
      Sso__ClientId: hostpanel
      # The cookie session for the admin SPA. Read only when the mode is sso —
      # AddInnovayseAuth is skipped entirely under local, which is what keeps this
      # product deployable on its own with no SSO anywhere. Under sso all of them
      # are required and the API refuses to start if one is missing, rather than
      # come up and hand every visitor an anonymous session.
      Auth__Mode: ${AUTH_MODE}
      Auth__AppName: hostpanel
      Auth__Authority: ${SSO_URL}
      # Where the browser is sent to sign in, when that differs from the address
      # this container reaches the SSO on. Optional: left empty, Authority is used
      # for both, which is right whenever the SSO is publicly addressable.
      Auth__PublicAuthority: ${SSO_PUBLIC_URL}
      Auth__ClientId: ${SSO_CLIENT_ID}
      # No :?required, unlike the other products: local mode never reads it, and a
      # required variable here would stop a standalone box from starting at all.
      # Under sso an empty value fails at startup by name instead.
      Auth__ClientSecret: ${CLIENT_HOSTPANEL_SECRET}
      Auth__RedisConnection: ${REDIS_CONNECTION}
      BackchannelLogout__Key: ${HOSTPANEL_BACKCHANNEL_LOGOUT_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  client:
    container_name: hostpanel-client
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      target: dev
    # The name other products, the edge proxy and the dev proxy address this one
    # by. Declared here rather than in docker-compose.platform.yml so it resolves
    # in a standalone deployment too — the alternative was the container name,
    # Compose's <project>-<service>-<index>, which breaks on a directory rename, a
    # second replica, or the stack coming up under another project's name.
    networks:
      default:
        aliases: [hostpanel-client]
    ports:
      - "3001:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      # hostpanel-api, the alias declared on the api service above — not the bare
      # "api" service name, which collides with innovayse-main's own "api" on the
      # shared network and has Docker's DNS round-robin between two products'
      # backends, and not the container name, which changes with the project.
      API_URL: http://hostpanel-api:5148
      NUXT_PUBLIC_BASE_URL: ${NUXT_PUBLIC_BASE_URL}
      NUXT_PUBLIC_MAIN_URL: ${NUXT_PUBLIC_MAIN_URL}
      SSO_URL: http://sso-api:8080
      SSO_PUBLIC_URL: ${SSO_PUBLIC_URL}
      NUXT_PUBLIC_TASKS_URL: ${NUXT_PUBLIC_TASKS_URL}
      NUXT_PUBLIC_ERP_URL: ${NUXT_PUBLIC_ERP_URL}
      NUXT_PUBLIC_SHEETS_URL: ${NUXT_PUBLIC_SHEETS_URL}
      NUXT_PUBLIC_EMAIL_URL: ${NUXT_PUBLIC_EMAIL_URL}
      NUXT_PUBLIC_NEXTCLOUD_URL: ${NUXT_PUBLIC_NEXTCLOUD_URL}
      SSO_CLIENT_ID: hostpanel
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL}
      STRIPE_PUBLISHABLE_KEY: pk_test_51Tc3tOEHRuUOoZmggqrvyuddpdtx6FtKaUSvqQXkwokJakOBFCLRDlX6troVkkjFw966agSmLKnu1NSlOAki6u9600PatIOktW
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      AUTH_MODE: ${AUTH_MODE}
      NUXT_MAIN_API_URL: http://main-client:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  admin:
    container_name: hostpanel-admin
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: dev
    # The name other products, the edge proxy and the dev proxy address this one
    # by. Declared here rather than in docker-compose.platform.yml so it resolves
    # in a standalone deployment too — the alternative was the container name,
    # Compose's <project>-<service>-<index>, which breaks on a directory rename, a
    # second replica, or the stack coming up under another project's name.
    networks:
      default:
        aliases: [hostpanel-admin]
    ports:
      - "5174:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: /api
      # The alias, not the bare service name: "api" is also innovayse-main's backend
      # on the shared platform network, and Docker's DNS round-robins between the two.
      API_PROXY_TARGET: http://hostpanel-api:5148
      # No VITE_SSO_URL / VITE_SSO_CLIENT_ID: nothing under admin/src reads them
      # any more. The SPA ran the OIDC flow itself as the public client
      # "hostpanel-admin" and kept both tokens in localStorage; it now sends the
      # browser to the API's /api/auth/login and holds only a cookie it cannot read.
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

volumes:
  pgdata:
  redisdata:
  client_node_modules:
  admin_node_modules:
  backend_bin:
  backend_obj:
  backend_packages:

