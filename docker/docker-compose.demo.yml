# Demo overlay: a second, self-contained copy of the stack that can share a server with production.
#   deployed host: shared + prod + platform + demo     laptop: shared + prod + demo
# Goes LAST in the chain so its project name wins. Everything stateful is renamed (project, containers,
# volumes) and the demo gets its own broker, redis and mail catcher, so nothing here can read or write
# production data.
#
# Networks. The demo must see NOTHING of production, at the network level:
#   - `default` is a demo-private bridge (it replaces the platform overlay's attachment to the production network),
#     so the database, broker, redis and mailhog are reachable only from inside the demo. It is deliberately
#     not `internal: true`: mailhog publishes its UI port on the host, which Docker cannot do from an
#     internal-only network. Nothing production-side is on it, so it reaches no production container anyway.
#   - `edge` is the dedicated external network hostpanel_demo_edge, NOT the production network. Only the edge proxy
#     (your reverse proxy, which is on both networks) and the three edge-facing demo services are on it. The demo
#     therefore cannot resolve or route to any production container (hostpanel-db, ...);
#     the one production-side peer it can address is the proxy itself, which routes by Host header.
#     Create it once per host:  docker network create --subnet 172.29.0.0/16 hostpanel_demo_edge  (deploy:demo does,
#     idempotently). The subnet is fixed because the edge proxy denies it on every production host (nginx.conf,
#     `deny 172.29.0.0/16`), so a demo container cannot reach production by sending a production Host header.
#     Each of the three is its own compose service named hostpanel-demo-*: compose always adds the SERVICE name
#     as an alias on every network, so keeping the names unique stops a hostpanel-api alias from ever
#     existing next to production's. The original hostpanel-api/-client/-admin are parked.
#   - Outbound: the demo needs no external service (fake adapters, mail to mailhog). The db, broker, redis and
#     mailhog are on the private bridge only; the api, client and admin keep the ordinary bridge egress of
#     hostpanel_demo_edge. To cut that too, create the edge network with --internal and drop the host ports.
# The API runs in demo mode: fake payment, registrar and provisioning adapters, mail to the catcher,
# a scheduled data reset. Needs AUTH_MODE=local and a database of its own (POSTGRES_DB).
name: hostpanel-demo

networks:
  # Replaces (not merges with) the platform overlay's external production network.
  default: !override
    name: hostpanel-demo_default
    # Fixed, like the edge subnet: the demo client calls the API over it, so the API trusts it.
    ipam:
      config:
        - subnet: ${DEMO_NETWORK_SUBNET:?DEMO_NETWORK_SUBNET must be set}
  # Created by hand or by deploy:demo; it must exist before `up`. Never the production network.
  edge:
    name: hostpanel_demo_edge
    external: true

volumes:
  pgdata:
    name: hostpanel-demo_pgdata
  redisdata:
    name: hostpanel-demo_redisdata
  hostpanel_branding:
    name: hostpanel-demo_branding
  hostpanel_plugins:
    name: hostpanel-demo_plugins

services:
  hostpanel-db:
    container_name: hostpanel-demo-db
    networks: !override [default]

  # shared.yml defines the broker and redis; the platform overlay parks them for production's own.
  # The demo runs private ones, so the parking is lifted.
  hostpanel-rabbitmq:
    container_name: hostpanel-demo-rabbitmq
    profiles: !reset []
    networks: !override [default]

  hostpanel-redis:
    container_name: hostpanel-demo-redis
    profiles: !reset []
    networks: !override [default]

  # Mail catcher: every message the demo sends lands here and goes no further.
  hostpanel-mailhog:
    container_name: hostpanel-demo-mailhog
    image: ${MAILHOG_IMAGE:?MAILHOG_IMAGE must be set}
    networks: !override [default]
    ports:
      - "${DEMO_PUBLISH_ADDRESS:?DEMO_PUBLISH_ADDRESS must be set}:${DEMO_MAILHOG_UI_HOST_PORT}:8025"
    deploy:
      resources:
        limits:
          cpus: '${MAILHOG_CPUS:?MAILHOG_CPUS must be set}'
          memory: ${MAILHOG_MEMORY:?MAILHOG_MEMORY must be set}
    restart: unless-stopped

  # prod.yml's services are parked: they would carry the production service names onto the demo's networks.
  # The demo's own copies below extend them.
  hostpanel-api:
    profiles: ["disabled"]

  hostpanel-client:
    profiles: ["disabled"]

  hostpanel-admin:
    profiles: ["disabled"]

  hostpanel-demo-api:
    extends:
      file: docker-compose.prod.yml
      service: hostpanel-api
    container_name: hostpanel-demo-api
    networks: !override
      default: {}
      edge:
        aliases: [hostpanel-demo-api]
    ports:
      - "${DEMO_PUBLISH_ADDRESS:?DEMO_PUBLISH_ADDRESS must be set}:${DEMO_API_HOST_PORT}:${API_PORT}"
    environment:
      ConnectionStrings__DefaultConnection: "Host=hostpanel-demo-db;Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Auth__RedisConnection: hostpanel-demo-redis:${DEMO_REDIS_PORT}
      PortalSessions__RedisConnection: hostpanel-demo-redis:${DEMO_REDIS_PORT}
      RabbitMQ__Host: hostpanel-demo-rabbitmq
      # Mail goes to the catcher: host, port and credentials override together.
      Smtp__Host: hostpanel-demo-mailhog
      Smtp__Port: ${DEMO_SMTP_PORT}
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__Encryption: ${DEMO_SMTP_ENCRYPTION:?DEMO_SMTP_ENCRYPTION must be set}
      # The demo admin has its own address; production's would send demo mail links to the live panel.
      Cors__AllowedOrigins__0: ${DEMO_CLIENT_BASE_URL:?DEMO_CLIENT_BASE_URL must be set}
      AdminBaseUrl: ${DEMO_ADMIN_BASE_URL:?DEMO_ADMIN_BASE_URL must be set}
      ClientBaseUrl: ${DEMO_CLIENT_BASE_URL:?DEMO_CLIENT_BASE_URL must be set}
      # The demo client reaches the API over the private bridge and the edge proxy over the edge network.
      RateLimit__KnownNetworks__0: ${DEMO_NETWORK_SUBNET:?DEMO_NETWORK_SUBNET must be set}
      RateLimit__KnownNetworks__1: ${DEMO_EDGE_NETWORK_SUBNET:?DEMO_EDGE_NETWORK_SUBNET must be set}
      Demo__Enabled: ${DEMO_ENABLED}
      Demo__ResetIntervalHours: ${DEMO_RESET_INTERVAL_HOURS}
      Demo__AdminEmail: ${DEMO_ADMIN_EMAIL}
      Demo__AdminPassword: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD must be set}
      Demo__ClientEmail: ${DEMO_CLIENT_EMAIL}
      Demo__ClientPassword: ${DEMO_CLIENT_PASSWORD:?DEMO_CLIENT_PASSWORD must be set}
      # Optional: the contact shown on the storefront; empty keeps the seed's fictional pair. Display only,
      # mail still goes to the demo's mailhog (Smtp__Host above).
      Demo__ContactEmail: ${DEMO_CONTACT_EMAIL:-}
      Demo__ContactPhone: ${DEMO_CONTACT_PHONE:-}
    depends_on: !override
      hostpanel-db:
        condition: service_healthy
      hostpanel-rabbitmq:
        condition: service_healthy
      hostpanel-redis:
        condition: service_healthy
      hostpanel-mailhog:
        condition: service_started

  hostpanel-demo-client:
    extends:
      file: docker-compose.prod.yml
      service: hostpanel-client
    container_name: hostpanel-demo-client
    networks: !override
      default: {}
      edge:
        aliases: [hostpanel-demo-client]
    ports:
      - "${DEMO_PUBLISH_ADDRESS:?DEMO_PUBLISH_ADDRESS must be set}:${DEMO_CLIENT_HOST_PORT}:${CLIENT_PORT:?CLIENT_PORT must be set}"
    environment:
      NUXT_API_URL: http://hostpanel-demo-api:${API_PORT}
      # The demo's own public address, not production's CLIENT_BASE_URL.
      NUXT_PUBLIC_BASE_URL: ${DEMO_CLIENT_BASE_URL:?DEMO_CLIENT_BASE_URL must be set}
      NUXT_PUBLIC_SITE_URL: ${DEMO_CLIENT_BASE_URL:?DEMO_CLIENT_BASE_URL must be set}
      NUXT_SSO_CALLBACK_URL: ${DEMO_CLIENT_BASE_URL:?DEMO_CLIENT_BASE_URL must be set}/api/portal/auth/sso/callback
      # The demo's own Redis, never production's.
      NUXT_SESSION_REDIS: hostpanel-demo-redis:${DEMO_REDIS_PORT}
      # Key the stored sessions are encrypted with (the server refuses to start without it).
      NUXT_SESSION_ENCRYPTION_KEY: ${DEMO_SESSION_ENCRYPTION_KEY:?DEMO_SESSION_ENCRYPTION_KEY must be set}
      # How many proxies sit in front of the client portal: the visitor address it forwards is the Nth entry from the right of X-Forwarded-For (.env.example, CLIENT_TRUSTED_PROXY_COUNT).
      NUXT_TRUSTED_PROXY_COUNT: ${CLIENT_TRUSTED_PROXY_COUNT:-1}
      NUXT_PUBLIC_DOCS_URL: ${DOCS_URL:-}
    depends_on: !override
      hostpanel-demo-api:
        condition: service_healthy

  hostpanel-demo-admin:
    extends:
      file: docker-compose.prod.yml
      service: hostpanel-admin
    container_name: hostpanel-demo-admin
    environment:
      CLIENT_BASE_URL: ${DEMO_CLIENT_BASE_URL:?DEMO_CLIENT_BASE_URL must be set}
      DOCS_URL: ${DOCS_URL:-}
    networks: !override
      default: {}
      edge:
        aliases: [hostpanel-demo-admin]
    ports:
      - "${DEMO_PUBLISH_ADDRESS:?DEMO_PUBLISH_ADDRESS must be set}:${DEMO_ADMIN_HOST_PORT}:80"
    depends_on: !override
      hostpanel-demo-api:
        condition: service_healthy

  # The bundled edge proxy is never part of the demo: the host's proxy (or the published ports) fronts it.
  hostpanel-nginx:
    profiles: ["disabled"]
