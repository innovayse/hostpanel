# Dev stack over docker-compose.shared.yml: applications on their dev targets over bind mounts.
name: hostpanel

# The stack's own network gets a fixed subnet: the API believes X-Forwarded-For only from it, where the edge
# proxy and the client container sit (RateLimit__KnownNetworks__0 below). docker/README.md, Trusted proxies.
networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_NETWORK_SUBNET:?STACK_NETWORK_SUBNET must be set}

services:
  hostpanel-db:
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    deploy:
      resources:
        limits:
          cpus: '${DB_CPUS:?DB_CPUS must be set}'
          memory: ${DB_MEMORY:?DB_MEMORY must be set}

  hostpanel-rabbitmq:
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    deploy:
      resources:
        limits:
          cpus: '${RABBITMQ_CPUS:?RABBITMQ_CPUS must be set}'
          memory: ${RABBITMQ_MEMORY:?RABBITMQ_MEMORY must be set}

  hostpanel-redis:
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:?REDIS_CPUS must be set}'
          memory: ${REDIS_MEMORY:?REDIS_MEMORY must be set}

  # Dev-only mail catcher; kept out of the shared set so a server never runs it.
  hostpanel-mailhog:
    container_name: hostpanel-mailhog
    image: ${MAILHOG_IMAGE:?MAILHOG_IMAGE must be set}
    ports:
      - "${MAILHOG_SMTP_HOST_PORT}:1025"
      - "${MAILHOG_UI_HOST_PORT}:8025"
    deploy:
      resources:
        limits:
          cpus: '${MAILHOG_CPUS:?MAILHOG_CPUS must be set}'
          memory: ${MAILHOG_MEMORY:?MAILHOG_MEMORY must be set}

  hostpanel-api:
    container_name: hostpanel-api
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
      # The private feed credentials reach the restore as a BuildKit secret, never as a build argument.
      secrets:
        - nuget_credentials
    ports:
      - "${API_HOST_PORT}:${API_PORT}"
    volumes:
      - ../backend:/app
      - backend_bin:/app/src/Innovayse.Hostpanel.API/bin
      - backend_obj:/app/src/Innovayse.Hostpanel.API/obj
      - backend_packages:/root/.nuget/packages
      # Testcontainers for the integration suite run from inside this container. Dev only.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: ${API_PORT}
      AllowedHosts: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      # One trusted hop, the edge proxy or the client container, both on the stack network.
      RateLimit__TrustedProxyCount: ${RATE_LIMIT_TRUSTED_PROXY_COUNT:?RATE_LIMIT_TRUSTED_PROXY_COUNT must be set}
      RateLimit__KnownNetworks__0: ${STACK_NETWORK_SUBNET:?STACK_NETWORK_SUBNET must be set}
      DOTNET_USE_POLLING_FILE_WATCHER: ${DEV_FILE_POLLING:?DEV_FILE_POLLING must be set}
      DOTNET_NUGET_SIGNATURE_VERIFICATION: ${DEV_NUGET_SIGNATURE_VERIFICATION:?DEV_NUGET_SIGNATURE_VERIFICATION must be set}
      # A legacy install pulled from during development usually runs beside this one over plain
      # HTTP on a private address; every other tier keeps the HTTPS and public-address defaults.
      MigrationSource__AllowInsecureHttp: "true"
      MigrationSource__AllowPrivateNetworks: "true"

      # Sign-in passwords of the accounts DevDataSeeder creates. Published development fixtures, required by the seeder.
      # An http origin a plugin preview may frame on this machine, such as a local site host; empty means none.
      PluginPreview__DevelopmentHttpOrigins__0: ${PLUGIN_PREVIEW_DEV_HTTP_ORIGIN:-}
      PluginPreview__DevelopmentHttpOrigins__1: ${PLUGIN_PREVIEW_DEV_HTTP_ORIGIN_2}
      DevDataSeed__AdminPassword: ${DEV_SEED_ADMIN_PASSWORD:-Admin123!}
      DevDataSeed__ClientPassword: ${DEV_SEED_CLIENT_PASSWORD:-Test@12345}

      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

      Auth__RedisConnection: ${REDIS_CONNECTION}
      # The client portal's sign-in sessions live in the same Redis; a back-channel logout ends them.
      PortalSessions__RedisConnection: ${REDIS_CONNECTION}

      RabbitMQ__Host: ${RABBITMQ_HOST}
      RabbitMQ__Port: ${RABBITMQ_PORT}
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From__Address: ${SMTP_FROM}
      Smtp__From__Name: ${SMTP_FROM_NAME}
      Smtp__Encryption: ${SMTP_ENCRYPTION}
      Notifications__ContactEmail: ${EMAIL_TO}
      DefaultDepartments__SupportEmail: ${DEPARTMENT_SUPPORT_EMAIL:?DEPARTMENT_SUPPORT_EMAIL must be set}
      DefaultDepartments__BillingEmail: ${DEPARTMENT_BILLING_EMAIL:?DEPARTMENT_BILLING_EMAIL must be set}
      DefaultDepartments__SalesEmail: ${DEPARTMENT_SALES_EMAIL:?DEPARTMENT_SALES_EMAIL must be set}
      DefaultDepartments__GeneralEmail: ${DEPARTMENT_GENERAL_EMAIL:?DEPARTMENT_GENERAL_EMAIL must be set}
      # The plugin registry the admin panel installs plugins from; off until PLUGIN_REGISTRY_BASE_URL (https) is set.
      PluginRegistry__Enabled: ${PLUGIN_REGISTRY_ENABLED}
      PluginRegistry__BaseUrl: ${PLUGIN_REGISTRY_BASE_URL}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID}

      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Session__AccessTokenMinutes: ${SESSION_ACCESS_TOKEN_MINUTES}
      Session__MaxSessionMinutes: ${SESSION_MAX_MINUTES}
      EncryptionKey: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      Auth__Mode: ${AUTH_MODE}
      Auth__AppName: ${AUTH_APP_NAME:?AUTH_APP_NAME must be set}
      Auth__Authority: ${SSO_URL}
      Auth__PublicAuthority: ${SSO_PUBLIC_URL}
      Auth__ClientId: ${SSO_CLIENT_ID}
      Auth__ClientSecret: ${CLIENT_HOSTPANEL_SECRET}

      Sso__Authority: ${SSO_URL}
      Sso__ClientId: ${SSO_CLIENT_ID}
      Sso__ServiceKey: ${SSO_SERVICE_KEY}

      Cors__AllowedOrigins__0: ${CORS_CLIENT_ORIGIN}
      Cors__AllowedOrigins__1: ${CORS_ADMIN_ORIGIN}
      Cors__AllowedOrigins__2: ${PANEL_DEV_ORIGIN}
      Cors__AllowedOrigins__3: ${CORS_STAGE_ORIGIN}
      # Where mailed staff links (email verification) land; a bare top-level key, not a section.
      AdminBaseUrl: ${CORS_ADMIN_ORIGIN}
      # Where mailed client links (verification, password reset, invoices) land.
      ClientBaseUrl: ${CORS_CLIENT_ORIGIN}

      TESTCONTAINERS_HOST_OVERRIDE: ${TESTCONTAINERS_HOST_OVERRIDE:?TESTCONTAINERS_HOST_OVERRIDE must be set}
      NUGET_AUDIT: ${DEV_NUGET_AUDIT:?DEV_NUGET_AUDIT must be set}
      NuGetPackageSourceCredentials_innovayse: ${NUGET_INNOVAYSE_CREDENTIALS}
      BackchannelLogout__Key: ${HOSTPANEL_BACKCHANNEL_LOGOUT_KEY}
    healthcheck:
      # `localhost`, not 127.0.0.1: AllowedHosts (ALLOWED_HOSTS) lists names, so the host filter answers
      # 400 to a literal loopback IP and the container stayed unhealthy while serving. A GET to
      # /dev/null, not --spider: that sends HEAD, which the GET-only /health route refuses.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${API_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      hostpanel-db:
        condition: service_healthy
      hostpanel-rabbitmq:
        condition: service_healthy
      hostpanel-mailhog:
        condition: service_started
      hostpanel-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS:?API_CPUS must be set}'
          memory: ${API_MEMORY:?API_MEMORY must be set}

  hostpanel-client:
    container_name: hostpanel-client
    build:
      context: ../client
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${CLIENT_HOST_PORT}:${CLIENT_PORT:?CLIENT_PORT must be set}"
    volumes:
      - ../client:/app
      - client_node_modules:/app/node_modules
      # Off the bind mount: thousands of small rewrites per compile are ~100x slower across the Windows mount.
      - client_nuxt:/app/.nuxt
      - client_output:/app/.output
    environment:
      AUTH_MODE: ${AUTH_MODE}
      # Nuxt reads these two at runtime; AUTH_MODE alone only reaches nuxt.config at startup,
      # which is why a local-mode dev stack still rendered the SSO sign-in.
      NUXT_AUTH_MODE: ${AUTH_MODE}
      NUXT_PUBLIC_AUTH_MODE: ${AUTH_MODE}

      SSO_URL: ${SSO_URL}
      SSO_PUBLIC_URL: ${SSO_PUBLIC_URL}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID}
      NUXT_SSO_CLIENT_SECRET: ${CLIENT_HOSTPANEL_SECRET}
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL}

      NITRO_PORT: ${CLIENT_PORT:?CLIENT_PORT must be set}
      API_URL: http://hostpanel-api:${API_PORT}
      NUXT_PUBLIC_BASE_URL: ${NUXT_PUBLIC_BASE_URL}
      NUXT_PUBLIC_MAIN_URL: ${MAIN_APP_URL}
      NUXT_PUBLIC_TASKS_URL: ${NUXT_PUBLIC_TASKS_URL}
      NUXT_PUBLIC_ERP_URL: ${NUXT_PUBLIC_ERP_URL}
      NUXT_PUBLIC_SHEETS_URL: ${NUXT_PUBLIC_SHEETS_URL}
      NUXT_PUBLIC_EMAIL_URL: ${NUXT_PUBLIC_EMAIL_URL}
      NUXT_PUBLIC_DRIVE_URL: ${NUXT_PUBLIC_DRIVE_URL}
      NUXT_PUBLIC_PORTAL_TEMPLATE: ${NUXT_PUBLIC_PORTAL_TEMPLATE}
      NUXT_PUBLIC_PORTAL_APPS_ENABLED: ${NUXT_PUBLIC_PORTAL_APPS_ENABLED}
      NUXT_PUBLIC_PORTAL_CONTACT_EMAIL: ${NUXT_PUBLIC_PORTAL_CONTACT_EMAIL}
      NUXT_PUBLIC_PORTAL_SOCIAL_TWITTER: ${NUXT_PUBLIC_PORTAL_SOCIAL_TWITTER}
      NUXT_PUBLIC_PORTAL_SOCIAL_LINKEDIN: ${NUXT_PUBLIC_PORTAL_SOCIAL_LINKEDIN}
      NUXT_PUBLIC_PORTAL_SOCIAL_FACEBOOK: ${NUXT_PUBLIC_PORTAL_SOCIAL_FACEBOOK}
      NUXT_PUBLIC_PORTAL_HOSTING_DEMO_URL: ${NUXT_PUBLIC_PORTAL_HOSTING_DEMO_URL}
      NUXT_PUBLIC_PORTAL_CONTACT_ADDRESS: ${NUXT_PUBLIC_PORTAL_CONTACT_ADDRESS}
      NUXT_PUBLIC_PORTAL_CONTACT_MAP_URL: ${NUXT_PUBLIC_PORTAL_CONTACT_MAP_URL}
      NUXT_PUBLIC_PORTAL_STATS_CLIENTS: ${NUXT_PUBLIC_PORTAL_STATS_CLIENTS}
      NUXT_PUBLIC_PORTAL_STATS_UPTIME: ${NUXT_PUBLIC_PORTAL_STATS_UPTIME}
      NUXT_PUBLIC_PORTAL_STATS_REGIONS: ${NUXT_PUBLIC_PORTAL_STATS_REGIONS}
      NUXT_PUBLIC_PORTAL_HERO_BADGE: ${NUXT_PUBLIC_PORTAL_HERO_BADGE}
      NUXT_PUBLIC_PORTAL_SITE_NAME: ${NUXT_PUBLIC_PORTAL_SITE_NAME}
      NUXT_PUBLIC_PORTAL_SITE_TAGLINE: ${NUXT_PUBLIC_PORTAL_SITE_TAGLINE}
      NUXT_PUBLIC_PORTAL_THEME_DEFAULT: ${NUXT_PUBLIC_PORTAL_THEME_DEFAULT}
      NUXT_PUBLIC_PORTAL_THEME_USER_TOGGLE: ${NUXT_PUBLIC_PORTAL_THEME_USER_TOGGLE}
      NUXT_PUBLIC_PORTAL_LOGO: ${NUXT_PUBLIC_PORTAL_LOGO}
      NUXT_PUBLIC_PORTAL_LOGO_DARK: ${NUXT_PUBLIC_PORTAL_LOGO_DARK}
      NUXT_PUBLIC_PORTAL_LOGO_MARK: ${NUXT_PUBLIC_PORTAL_LOGO_MARK}
      NUXT_PUBLIC_PORTAL_FAVICON: ${NUXT_PUBLIC_PORTAL_FAVICON}
      NUXT_PUBLIC_PORTAL_BRAND_PRIMARY: ${NUXT_PUBLIC_PORTAL_BRAND_PRIMARY}
      NUXT_PUBLIC_PORTAL_BRAND_ACCENT: ${NUXT_PUBLIC_PORTAL_BRAND_ACCENT}
      NUXT_PUBLIC_PORTAL_BRAND_FONT_HEADING: ${NUXT_PUBLIC_PORTAL_BRAND_FONT_HEADING}
      NUXT_PUBLIC_PORTAL_BRAND_FONT_BODY: ${NUXT_PUBLIC_PORTAL_BRAND_FONT_BODY}
      NUXT_PUBLIC_PORTAL_GTM_ID: ${NUXT_PUBLIC_PORTAL_GTM_ID}
      NUXT_PUBLIC_PORTAL_CHAT_BASE_URL: ${NUXT_PUBLIC_PORTAL_CHAT_BASE_URL}
      NUXT_PUBLIC_PORTAL_CHAT_WEBSITE_TOKEN: ${NUXT_PUBLIC_PORTAL_CHAT_WEBSITE_TOKEN}
      NUXT_PUBLIC_PORTAL_CHAT_WEBSITE_TOKEN_RU: ${NUXT_PUBLIC_PORTAL_CHAT_WEBSITE_TOKEN_RU}
      NUXT_PUBLIC_PORTAL_CHAT_WEBSITE_TOKEN_HY: ${NUXT_PUBLIC_PORTAL_CHAT_WEBSITE_TOKEN_HY}
      BILLING_PORTAL_URL: ${BILLING_PORTAL_URL}
      NUXT_PUBLIC_DOCS_URL: ${DOCS_URL:-}
      # Where the signed-in sessions are kept (the tokens never reach the browser): the API's Redis.
      NUXT_SESSION_REDIS: ${REDIS_CONNECTION}
      # Key the stored sessions are encrypted with; optional here because the dev server runs in development mode.
      NUXT_SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      # No proxy in front of the dev server: it is reached directly, so X-Forwarded-For is never believed.
      NUXT_TRUSTED_PROXY_COUNT: 0
      # Extra host names the dev server answers to besides localhost (comma separated); empty when the portal is reached on localhost only.
      NUXT_DEV_ALLOWED_HOSTS: ${CLIENT_DEV_ALLOWED_HOSTS:-}

      WATCHPACK_POLLING: ${DEV_FILE_POLLING:?DEV_FILE_POLLING must be set}
      CHOKIDAR_USEPOLLING: ${DEV_FILE_POLLING:?DEV_FILE_POLLING must be set}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "${CLIENT_PORT:?CLIENT_PORT must be set}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - hostpanel-api
    deploy:
      resources:
        limits:
          cpus: '${CLIENT_CPUS:?CLIENT_CPUS must be set}'
          memory: ${CLIENT_MEMORY:?CLIENT_MEMORY must be set}

  hostpanel-admin:
    container_name: hostpanel-admin
    build:
      context: ..
      dockerfile: admin/Dockerfile
      target: dev
    ports:
      - "${ADMIN_HOST_PORT}:5173"
    volumes:
      - ../admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: ${ADMIN_API_BASE:?ADMIN_API_BASE must be set}

      API_PROXY_TARGET: http://hostpanel-api:${API_PORT}
      ADMIN_DEV_ALLOWED_HOSTS: ${ADMIN_DEV_ALLOWED_HOSTS:-}
      CHOKIDAR_USEPOLLING: ${DEV_FILE_POLLING:?DEV_FILE_POLLING must be set}
    healthcheck:
      # A port probe, like the client: rendering the SPA shell as a liveness check took ~40s on the
      # dev bind mount while Vite transformed it, well past the 5s timeout.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5173"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - hostpanel-api
    deploy:
      resources:
        limits:
          cpus: '${ADMIN_CPUS:?ADMIN_CPUS must be set}'
          memory: ${ADMIN_MEMORY:?ADMIN_MEMORY must be set}

secrets:
  # Read from the environment at build time only (docker compose build).
  nuget_credentials:
    environment: NUGET_INNOVAYSE_CREDENTIALS

volumes:
  client_node_modules:
    name: hostpanel_client_node_modules
  client_nuxt:
    name: hostpanel_client_nuxt
  client_output:
    name: hostpanel_client_output
  admin_node_modules:
    name: hostpanel_admin_node_modules
  backend_bin:
    name: hostpanel_backend_bin
  backend_obj:
    name: hostpanel_backend_obj
  backend_packages:
    name: hostpanel_backend_packages
