upstream api_backend {
    server api:5148;
}

upstream client_frontend {
    server client:3000;
}

upstream admin_frontend {
    server admin:80;
}

# What scheme the BROWSER used, which is not $scheme. TLS terminates at the edge
# proxy, so this container is always reached over plain http and $scheme is always
# "http". Forwarding that would tell the API the request arrived insecurely, and
# Innovayse.Auth then refuses to complete a sign-in ("This application is not
# served over HTTPS") because a browser silently discards its __Host- prefixed
# session cookies on an insecure origin. So pass on what the edge already
# reported, and fall back to $scheme only when nothing is in front — a plain
# `docker compose up` on a laptop, where http is the truth.
map $http_x_forwarded_proto $panel_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Main site — client + API
server {
    listen 80;
    server_name ${DOMAIN};

    client_max_body_size 50m;

    # API requests
    location /api/ {
        proxy_pass         http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $panel_forwarded_proto;
    }

    # Scalar API docs
    location /scalar/ {
        proxy_pass         http://api_backend/scalar/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Everything else — Nuxt SSR
    location / {
        proxy_pass         http://client_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $panel_forwarded_proto;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# Admin panel
server {
    listen 80;
    server_name ${ADMIN_DOMAIN};

    location / {
        proxy_pass         http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $panel_forwarded_proto;
    }
}
