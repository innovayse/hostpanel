# Referrer-Policy default for security-headers.conf: empty when a response already carries its own policy
# (the header is then skipped), the default otherwise.
map $upstream_http_referrer_policy $referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

server {
    # Never name the proxy or its version in a response.
    server_tokens off;
    # The unprivileged nginx binds this port as a non-root user; the compose files lower
    # net.ipv4.ip_unprivileged_port_start for the container, so the port stays the one every proxy knows.
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is text and the link to a hosting-panel operator is often a thin one (a tether, a
    # tunnel with ~90 ms round trips), so it is compressed here, at the origin, and travels compressed
    # all the way: the entry chunk alone is ~450 kB raw. `gzip_proxied any` because the edge proxy in
    # front of this container would otherwise make nginx treat every request as one not to compress.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # Every location below sets a header of its own, which makes nginx drop the headers a server block
    # would pass down. So each location includes the same two snippets by name.

    # Written at container start; never cached, so a changed base path takes effect on restart.
    location = /config.js {
        include snippets/security-headers.conf;
        include snippets/admin-csp.conf;
        add_header Cache-Control "no-store";
    }
    # No `$uri/` here: a directory hit answers with a 301 that names the container's own host and
    # port, and the SPA has a route (/integrations) that shares its name with the folder of
    # integration logos in public/. Reloading or deep-linking that page therefore sent the browser
    # to an address that does not exist. Files are served as they are, everything else is the SPA.
    location / {
        include snippets/security-headers.conf;
        include snippets/admin-csp.conf;
        try_files $uri /index.html;
    }

    # The shell and every file that keeps its name across releases are revalidated on each load, so a
    # release is picked up at once; the ETag makes that a cheap 304.
    location = /index.html {
        include snippets/security-headers.conf;
        include snippets/admin-csp.conf;
        add_header Cache-Control "no-cache";
    }

    # Everything under assets/ carries a content hash in its name, so a given URL never changes and
    # the browser may keep it for good instead of re-asking the server for each chunk on each visit.
    # No try_files: a chunk that no longer exists must be a 404, never the HTML shell answering a
    # script request with a page the browser would then cache as that script.
    location /assets/ {
        include snippets/security-headers.conf;
        include snippets/admin-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
