# Content-Security-Policy of the admin panel, included beside security-headers.conf in every location of
# admin.conf. The SPA is one bundle of same-origin scripts and styles and talks to the API on its own
# origin, so the policy starts from 'self':
#   style-src       'unsafe-inline' because Vue writes style attributes; every font is bundled
#                   with the panel and served from its own origin, so no font host is allowed.
#   img-src         data: and blob: for previews, https: for the storefront images and logos the
#                   operator stores as absolute addresses.
#   connect-src     the API on the same origin only.
#   frame-ancestors the panel is never framed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
